# Drop-in for mt5-terminal.service (install as
# /etc/systemd/system/mt5-terminal.service.d/omega-profile.conf, then `systemctl daemon-reload`).
# omega-bridge starts the terminal on its own chart profile "Omega" ([Charts] ProfileLast=Omega). MT5 saves
# every chart it had open, and the [StartUp] chart is added again at each start, so empty the profile first:
# only the OmegaExecutor chart opens, on the symbol the bridge chose for the selected server.
[Service]
ExecStartPre=/bin/sh -c 'd="$${WINEPREFIX}/drive_c/Program Files/MetaTrader 5/MQL5/Profiles/Charts/Omega"; mkdir -p "$$d" && rm -f "$$d"/*.chr'
