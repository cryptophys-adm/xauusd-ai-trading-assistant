# Drop-in for mt5-terminal.service (install as
# /etc/systemd/system/mt5-terminal.service.d/omega-profile.conf, then `systemctl daemon-reload`).
# omega-bridge starts the terminal on its own chart profile "Omega" ([Charts] ProfileLast=Omega). MT5 saves
# every chart it had open, and the [StartUp] chart is added again at each start, so empty the profile first:
# only the OmegaExecutor chart opens, on the symbol the bridge chose for the selected server.
# Runs only when systemd starts or restarts the terminal, never while it runs. The EA's inputs are its compiled
# defaults (omega-bridge removes [StartUp] ExpertParameters), so nothing it needs is in these .chr files; an input
# changed by hand on the chart is lost at the next restart. WINEPREFIX must be set in mt5-terminal.service: an
# empty one fails the start loudly instead of cleaning nothing (PR #405).
[Service]
ExecStartPre=/bin/sh -c 'test -n "$${WINEPREFIX}" || { echo "omega-profile: WINEPREFIX is not set in mt5-terminal.service" >&2; exit 1; }; d="$${WINEPREFIX}/drive_c/Program Files/MetaTrader 5/MQL5/Profiles/Charts/Omega"; mkdir -p "$$d" && rm -f "$$d"/*.chr'
