name: Deploy Market Data Ingestion Worker

# Deploys `xauusd-tradingview-pull-adapter` (TradingView-native OHLCV + H1
# local_computation publisher) automatically on main, like the other Workers.
# Inter-Worker calls use RPC Service Bindings (TvGateway on the news Worker,
# LocalComputationIngress on the AI Worker), so no shared secret is required:
# only CLOUDFLARE_API_TOKEN. MARKET_DATA_INGEST_SECRET is optional and only
# enables the manual HTTP endpoints (/pull, /latest, /engine-*, /publish-local).
on:
  push:
    branches: [main]
    paths:
      - "market-data-ingestion/**"
      - "local-engines/**"
      - "src/prophet-r37-*.mjs"
      - "scripts/engine-provenance.mjs"
      - ".github/workflows/deploy-market-data-ingestion.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-market-data-ingestion
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Run market data, Prophet R38 and producer tests
        run: node --test market-data-ingestion/test/*.test.mjs local-engines/prophet-r38/test/*.test.mjs local-engines/producer/test/*.test.mjs local-engines/gmi/test/*.test.mjs test/engine-provenance.test.mjs

      - name: Require Cloudflare deploy credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then echo "::error::CLOUDFLARE_API_TOKEN is not configured."; exit 1; fi

      - name: Validate Worker bundle
        run: npx --yes wrangler@4.45.0 deploy --dry-run --config market-data-ingestion/wrangler.jsonc

      - name: Deploy Worker
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4.45.0 deploy --config market-data-ingestion/wrangler.jsonc | tee deploy.log
          url=$(grep -Eo 'https://[A-Za-z0-9.-]+\.workers\.dev' deploy.log | head -n1 || true)
          if [ -z "$url" ]; then echo "::error::Could not determine workers.dev URL from deploy output."; exit 1; fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          version=$(grep -Eo 'Current Version ID: [0-9a-f-]+' deploy.log | awk '{print $4}' || true)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set optional manual-endpoint secret (value never echoed)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          MARKET_DATA_INGEST_SECRET: ${{ secrets.MARKET_DATA_INGEST_SECRET }}
        run: |
          set -euo pipefail
          if [ -n "${MARKET_DATA_INGEST_SECRET:-}" ]; then
            printf '%s' "$MARKET_DATA_INGEST_SECRET" | npx --yes wrangler@4.45.0 secret put MARKET_DATA_INGEST_SECRET --config market-data-ingestion/wrangler.jsonc >/dev/null
            echo "Manual endpoint secret updated."
          else
            echo "MARKET_DATA_INGEST_SECRET not set: manual HTTP endpoints stay disabled (cron ingestion and publishing are unaffected)."
          fi

      - name: Smoke test deployed Worker
        env:
          WORKER_URL: ${{ steps.deploy.outputs.url }}
          WORKER_VERSION: ${{ steps.deploy.outputs.version }}
        run: |
          node --input-type=module <<'NODE'
          const base = process.env.WORKER_URL;
          const get = async (path, init = {}) => {
            try {
              const r = await fetch(base + path, { ...init, signal: AbortSignal.timeout(20000) });
              let body; try { body = await r.json(); } catch { body = null; }
              return { status: r.status, body };
            } catch (error) { return { status: 0, body: null, error: error?.name }; }
          };
          const fail = (msg, extra) => { console.error(msg, extra ? JSON.stringify(extra).slice(0, 2000) : ""); process.exit(1); };
          let health;
          for (let i = 0; i < 10; i++) {
            health = await get("/health");
            if (health.status === 200) break;
            await new Promise(r => setTimeout(r, 3000));
          }
          if (health.status !== 200 || health.body?.status !== "ok") fail("health failed", health);
          for (const k of ["gateway_configured", "gateway_binding", "cache_configured", "local_publisher_configured"]) {
            if (health.body[k] !== true) fail(`health: ${k} is not true`, health.body);
          }
          for (const path of ["/latest", "/engine-shadow?engine=prophet", "/local-computation/latest"]) {
            const r = await get(path);
            if (r.status !== 401) fail(`${path} must reject unauthenticated access`, r);
          }
          console.log(JSON.stringify({ url: base, version: process.env.WORKER_VERSION, health: health.body }, null, 2));
          NODE

      - name: Record rollback instructions
        if: always()
        run: |
          {
            echo "### xauusd-tradingview-pull-adapter"
            echo "- Deployed URL: ${{ steps.deploy.outputs.url }}"
            echo "- Version ID: ${{ steps.deploy.outputs.version }}"
            echo "- Rollback: \`npx wrangler rollback --config market-data-ingestion/wrangler.jsonc\` (or delete the Worker; it owns no D1 and only a dedicated KV key prefix)."
            echo "- local_computation outputs are trusted only via the AI Worker's autonomous parity registry."
          } >> "$GITHUB_STEP_SUMMARY"
