name: Train decision model

# The decision model (docs/RFC_CUSTOM_MODEL.md step 3; owner 2026-11-13: "1-3"): once a day, LightGBM
# learns from the custom model's labeled dataset (src/model-dataset.mjs) and its trees go to KV
# model:gbm:v1, where the AI Worker evaluates them in shadow only (src/model-gbm.mjs).
#
# The repository is public (RFC section 2): the dataset and the model live only in the runner's temp
# directory and in Cloudflare; no step prints a row, a feature value or a tree, and nothing is uploaded
# as an artifact. The logs carry counts and aggregate scores only.

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: train-decision-model
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the trainer
        run: python -m pip install --quiet -r scripts/train-requirements.txt

      - name: Fetch the labeled dataset (to a temp file; counts only in the log)
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: node scripts/fetch-dataset.mjs "$RUNNER_TEMP/dataset.json"

      - name: Train (aggregate scores only in the log)
        id: train
        run: |
          set +e
          python scripts/train_gbm.py --input "$RUNNER_TEMP/dataset.json" --output "$RUNNER_TEMP/model.json"
          code=$?
          set -e
          if [ "$code" = "3" ]; then echo "store=false" >> "$GITHUB_OUTPUT"; echo "::notice::Not enough labeled rows yet; nothing stored."; exit 0; fi
          if [ "$code" != "0" ]; then exit "$code"; fi
          echo "store=true" >> "$GITHUB_OUTPUT"

      - name: Store the model in KV (model:gbm:v1)
        if: steps.train.outputs.store == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4.45.0 kv key put "model:gbm:v1" --path "$RUNNER_TEMP/model.json" --namespace-id 4ada6196de5a4000a28a047bf6b30ff3 --remote > /dev/null

      - name: Remove the temp files
        if: always()
        run: rm -f "$RUNNER_TEMP/dataset.json" "$RUNNER_TEMP/model.json"
