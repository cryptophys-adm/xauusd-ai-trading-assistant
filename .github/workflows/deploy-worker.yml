name: Validate and deploy Cloudflare Worker

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "wrangler.jsonc"
      - "package.json"
      - "tsconfig.json"
      - "test/**"
      - "migrations/**"
      - "schema.sql"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Run contract tests
        run: npm test
      - name: Type-check
        run: npm run typecheck
      - name: Validate Worker bundle
        run: npx wrangler deploy --dry-run --config wrangler.jsonc

      # No operator-approved hash allowlist: local-engine provenance is decided at runtime by the
      # AI Worker's autonomous parity registry (TradingView webhook outputs as comparator).
      - name: Apply production D1 migrations when a D1-scoped token is configured
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${CLOUDFLARE_D1_API_TOKEN:-}" ]; then
            CLOUDFLARE_API_TOKEN="$CLOUDFLARE_D1_API_TOKEN" npx wrangler d1 migrations apply xauusd-signals --remote --config wrangler.jsonc
          else
            echo "CLOUDFLARE_D1_API_TOKEN is not configured. The required analysis_runs migration was applied out-of-band for this release; the post-deploy /ready smoke test must verify it."
          fi
        env:
          CLOUDFLARE_D1_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}

      - name: Deploy Worker
        run: npx wrangler deploy --config wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Smoke test live Worker
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          node --input-type=module <<'NODE'
          import { accessToken, isAccessLogin } from "./scripts/access-token.mjs";
          const url = "https://ai.cryptophys.work/health";
          const response = await fetch(url, { signal: AbortSignal.timeout(15000) });
          const body = await response.json();
          if (!response.ok || body.status !== "ok") {
            throw new Error(`Health endpoint failed: HTTP ${response.status} ${JSON.stringify(body)}`);
          }
          const readyResponse = await fetch("https://ai.cryptophys.work/ready", { signal: AbortSignal.timeout(15000) });
          const ready = await readyResponse.json();
          if (!readyResponse.ok || ready.status !== "ready" || ready.d1_analysis_runs !== true || ready.provenance_mode !== "autonomous_parity_registry") {
            throw new Error(`Readiness endpoint failed: HTTP ${readyResponse.status} ${JSON.stringify(ready)}`);
          }
          for (const [name, configured] of Object.entries(body.bindings ?? {})) {
            if (configured !== true) throw new Error(`Missing runtime binding: ${name}`);
          }
          if (body.secrets_configured?.webhook_secret !== true) {
            throw new Error("WEBHOOK_SECRET is not configured in the deployed Worker");
          }
          console.log(JSON.stringify({ url, status: response.status, body, readiness: ready }, null, 2));
          // The read API sits behind Cloudflare Access (platform provision-access.yml, ai.cryptophys.work/api/*).
          // With the CI service token configured, check both sides: no answer without it, the API with it.
          // The token probe never follows a redirect: Access refusing the token answers 302 to its login page.
          const token = accessToken();
          if (token.problems.length) throw new Error(`CF_ACCESS_CLIENT_ID/SECRET: ${token.problems.join("; ")} (${token.shape})`);
          if (token.headers) {
            const open = await fetch("https://ai.cryptophys.work/api/decisions", { redirect: "manual", signal: AbortSignal.timeout(15000) });
            if (!isAccessLogin(open)) throw new Error(`GET /api/decisions without credentials answered HTTP ${open.status}, not the Access login: the read API is not locked`);
            const authed = await fetch("https://ai.cryptophys.work/api/status", { redirect: "manual", headers: token.headers, signal: AbortSignal.timeout(15000) });
            if (isAccessLogin(authed)) throw new Error(`Cloudflare Access refused the CI service token (${token.shape}). Set CF_ACCESS_CLIENT_ID and CF_ACCESS_CLIENT_SECRET to the cryptophys-ci Client ID and its current Client Secret`);
            const statusBody = await authed.json().catch(() => null);
            if (authed.status !== 200 || !statusBody || typeof statusBody !== "object") throw new Error(`GET /api/status with the CI service token: HTTP ${authed.status}, not the status JSON`);
            console.log(`read API locked (unauthenticated ${open.status} to the Access login); service token accepted (${authed.status}, status JSON)`);
          } else console.log("CF_ACCESS_CLIENT_ID/SECRET not set: the read-API lock is not checked");
          NODE
