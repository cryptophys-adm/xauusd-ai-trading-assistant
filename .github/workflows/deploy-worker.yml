name: Validate and deploy Cloudflare Worker

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "wrangler.jsonc"
      - "package.json"
      - "tsconfig.json"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Type-check
        run: npm run typecheck
      - name: Deploy Worker
        run: npx wrangler deploy --config wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Smoke test live Worker
        run: |
          node --input-type=module <<'NODE'
          const url = "https://ai.cryptophys.work/health";
          const response = await fetch(url, { signal: AbortSignal.timeout(15000) });
          const body = await response.json();
          if (!response.ok || body.status !== "ok") {
            throw new Error(`Health endpoint failed: HTTP ${response.status} ${JSON.stringify(body)}`);
          }
          for (const [name, configured] of Object.entries(body.bindings ?? {})) {
            if (configured !== true) throw new Error(`Missing runtime binding: ${name}`);
          }
          if (body.secrets_configured?.webhook_secret !== true) {
            throw new Error("WEBHOOK_SECRET is not configured in the deployed Worker");
          }
          console.log(JSON.stringify({ url, status: response.status, body }, null, 2));
          NODE
