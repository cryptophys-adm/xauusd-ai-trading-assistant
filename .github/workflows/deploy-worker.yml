name: Validate and deploy Cloudflare Worker

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "wrangler.jsonc"
      - "package.json"
      - "tsconfig.json"
      - "test/**"
      - "migrations/**"
      - "schema.sql"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Run contract tests
        run: npm test
      - name: Type-check
        run: npm run typecheck
      - name: Validate Worker bundle
        run: npx wrangler deploy --dry-run --config wrangler.jsonc

      - name: Require approved production provenance allowlist before deployment
        env:
          LOCAL_CALC_PROVENANCE_ALLOWLIST: ${{ secrets.LOCAL_CALC_PROVENANCE_ALLOWLIST }}
        run: |
          node --input-type=module <<'NODE'
          const raw = process.env.LOCAL_CALC_PROVENANCE_ALLOWLIST;
          if (!raw) throw new Error("Production deployment blocked: LOCAL_CALC_PROVENANCE_ALLOWLIST is not configured. Do not approve placeholder or unverified Pine/implementation hashes.");
          let policy;
          try { policy = JSON.parse(raw); } catch { throw new Error("Production provenance allowlist must be valid JSON."); }
          for (const engine of ["mizan", "prophet", "gmi"]) {
            const entry = policy[engine];
            if (!entry || !Array.isArray(entry.source_hashes) || !Array.isArray(entry.implementation_hashes) ||
                entry.source_hashes.length === 0 || entry.implementation_hashes.length === 0 ||
                !entry.source_hashes.every(value => typeof value === "string" && /^[a-f0-9]{64}$/i.test(value)) ||
                !entry.implementation_hashes.every(value => typeof value === "string" && /^[a-f0-9]{64}$/i.test(value))) {
              throw new Error("Production deployment blocked: approved SHA-256 source and implementation hashes are required for " + engine + ".");
            }
          }
          console.log("Production provenance allowlist shape validated for all three engines.");
          NODE
      - name: Apply production D1 migrations when a D1-scoped token is configured
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${CLOUDFLARE_D1_API_TOKEN:-}" ]; then
            CLOUDFLARE_API_TOKEN="$CLOUDFLARE_D1_API_TOKEN" npx wrangler d1 migrations apply xauusd-signals --remote --config wrangler.jsonc
          else
            echo "CLOUDFLARE_D1_API_TOKEN is not configured. The required analysis_runs migration was applied out-of-band for this release; the post-deploy /ready smoke test must verify it."
          fi
        env:
          CLOUDFLARE_D1_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}

      - name: Deploy Worker
        run: npx wrangler deploy --config wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Smoke test live Worker
        run: |
          node --input-type=module <<'NODE'
          const url = "https://ai.cryptophys.work/health";
          const response = await fetch(url, { signal: AbortSignal.timeout(15000) });
          const body = await response.json();
          if (!response.ok || body.status !== "ok") {
            throw new Error(`Health endpoint failed: HTTP ${response.status} ${JSON.stringify(body)}`);
          }
          const readyResponse = await fetch("https://ai.cryptophys.work/ready", { signal: AbortSignal.timeout(15000) });
          const ready = await readyResponse.json();
          if (!readyResponse.ok || ready.status !== "ready" || ready.d1_analysis_runs !== true) {
            throw new Error(`Readiness endpoint failed: HTTP ${readyResponse.status} ${JSON.stringify(ready)}`);
          }
          for (const [name, configured] of Object.entries(body.bindings ?? {})) {
            if (configured !== true) throw new Error(`Missing runtime binding: ${name}`);
          }
          if (body.secrets_configured?.webhook_secret !== true) {
            throw new Error("WEBHOOK_SECRET is not configured in the deployed Worker");
          }
          console.log(JSON.stringify({ url, status: response.status, body, readiness: ready }, null, 2));
          NODE
