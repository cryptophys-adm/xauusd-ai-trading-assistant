name: Deploy Fundamental News Ingestion

on:
  push:
    branches:
      - main
    paths:
      - "fundamental-news-ingestion/**"
      - ".github/workflows/deploy-fundamental-news-ingestion.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-fundamental-news-ingestion
  cancel-in-progress: true

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate Worker bundle
        run: npx --yes wrangler@4.45.0 deploy --dry-run --config fundamental-news-ingestion/wrangler.jsonc

      - name: Deploy Worker to Cloudflare
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID must be configured."
            exit 1
          fi
          npx --yes wrangler@4.45.0 deploy --config fundamental-news-ingestion/wrangler.jsonc
