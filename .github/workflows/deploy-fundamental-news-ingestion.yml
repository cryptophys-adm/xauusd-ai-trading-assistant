name: Deploy Fundamental News Ingestion

on:
  push:
    branches:
      - main
    paths:
      - "fundamental-news-ingestion/**"
      - ".github/workflows/deploy-fundamental-news-ingestion.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-fundamental-news-ingestion
  cancel-in-progress: true

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run Worker unit tests
        run: node --test fundamental-news-ingestion/test/index.test.mjs

      - name: Validate Worker bundle
        run: npx --yes wrangler@4.45.0 deploy --dry-run --config fundamental-news-ingestion/wrangler.jsonc

      - name: Deploy Worker to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Repository secret CLOUDFLARE_API_TOKEN must be configured."
            exit 1
          fi
          npx --yes wrangler@4.45.0 deploy --config fundamental-news-ingestion/wrangler.jsonc

      - name: Smoke test production health
        run: |
          response="$(curl --fail --silent --show-error --max-time 20 https://news.cryptophys.work/health)"
          printf '%s' "$response" | node -e '
            const h = JSON.parse(require("fs").readFileSync(0, "utf8"));
            const valid = h.status === "ok"
              && h.worker === "xauusd-fundamental-news-ingestion"
              && h.ingest_auth_configured === true
              && h.oauth_configured === true
              && h.oauth_authorized === true
              && h.oauth_store_configured === true;
            const summary = {
              worker: h.worker,
              status: h.status,
              provider: h.provider,
              ingest_auth_configured: h.ingest_auth_configured,
              oauth_configured: h.oauth_configured,
              oauth_authorized: h.oauth_authorized,
              oauth_store_configured: h.oauth_store_configured,
              last_scheduled_ingest: h.last_scheduled_ingest || null
            };
            console.log(JSON.stringify(summary));
            if (!valid) process.exit(1);
          '
