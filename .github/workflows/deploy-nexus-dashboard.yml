name: Deploy Nexus Dashboard Worker

# Deploys `xauusd-nexus-dashboard` (nexus.cryptophys.work) on main. The dashboard is a React SPA
# in the Cerebrum Console obsidian design (ui/, built into ui/dist and served as Workers Static
# Assets) plus read-only /api/* routes, so it needs no secrets beyond CLOUDFLARE_API_TOKEN.
on:
  push:
    branches: [main]
    paths:
      - "workers/xauusd-nexus-dashboard/**"
      - ".github/workflows/deploy-nexus-dashboard.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-nexus-dashboard
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Require Cloudflare deploy credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then echo "::error::CLOUDFLARE_API_TOKEN is not configured."; exit 1; fi

      - name: Build the Nexus UI
        working-directory: workers/xauusd-nexus-dashboard/ui
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Validate Worker bundle
        run: npx --yes wrangler@4.156.2 deploy --dry-run --config workers/xauusd-nexus-dashboard/wrangler.jsonc

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        # Version provenance (owner 2026-11-15, P5): tag = the commit's first 12 characters; /health reports it.
        run: npx --yes wrangler@4.156.2 deploy --config workers/xauusd-nexus-dashboard/wrangler.jsonc --tag "${GITHUB_SHA:0:12}" --message "commit ${GITHUB_SHA}" --var "DEPLOY_COMMIT:${GITHUB_SHA}" --var "DEPLOYED_AT:$(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - name: Smoke test
        # nexus.cryptophys.work is behind Cloudflare Access (owner, 2026-11-07): without credentials it
        # answers with the Access login redirect, which the first check requires. Every content check
        # runs against the custom domain with the CI service token (repository secrets
        # CF_ACCESS_CLIENT_ID and CF_ACCESS_CLIENT_SECRET); Nexus has no workers.dev address.
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          node --input-type=module <<'NODE'
          import { accessToken, isAccessLogin } from "./scripts/access-token.mjs";
          const DOMAIN = "https://nexus.cryptophys.work";
          // Normalised like the platform's access-headers.sh; problems are reported by shape, never by value.
          const token = accessToken();
          if (token.problems.length) { console.error(`CF_ACCESS_CLIENT_ID/SECRET: ${token.problems.join("; ")} (${token.shape})`); process.exit(1); }
          const TOKEN = token.headers;
          // workers.dev is disabled (owner, 2026-11-07): the content checks need the CI service token.
          if (!TOKEN) { console.error("CF_ACCESS_CLIENT_ID/CF_ACCESS_CLIENT_SECRET are required: Nexus has no public workers.dev address"); process.exit(1); }
          const ORIGIN = DOMAIN;
          const nativeFetch = globalThis.fetch;
          const fetch = (u, init = {}) => nativeFetch(u, TOKEN && String(u).startsWith(ORIGIN) ? { ...init, headers: { ...(init.headers || {}), ...TOKEN } } : init);
          console.log("using the CI service token against the custom domain");
          // The token must get past Access itself: without following redirects, a refusal is a 302 to the login page.
          const admitted = await nativeFetch(DOMAIN + "/", { redirect: "manual", headers: TOKEN, signal: AbortSignal.timeout(20000) });
          if (isAccessLogin(admitted)) { console.error(`Cloudflare Access refused the CI service token (${token.shape}). Set CF_ACCESS_CLIENT_ID and CF_ACCESS_CLIENT_SECRET to the cryptophys-ci Client ID and its current Client Secret`); process.exit(1); }
          console.log(`service token admitted by Access (HTTP ${admitted.status})`);
          const get = async (u, tries = 10) => { for (let i = 0; i < tries; i++) { try { const r = await fetch(u, { signal: AbortSignal.timeout(20000) }); if (r.ok) return r; } catch {} await new Promise(r => setTimeout(r, 3000)); } return null; };
          let front = null;
          for (let i = 0; i < 10 && !front; i++) { try { front = await nativeFetch(DOMAIN + "/", { redirect: "manual", signal: AbortSignal.timeout(20000) }); } catch { await new Promise(r => setTimeout(r, 3000)); } }
          if (!front) { console.error("custom domain did not answer"); process.exit(1); }
          const location = front.headers.get("location") || "";
          if (front.status >= 300 && front.status < 400 && /^https:\/\/[a-z0-9-]+\.cloudflareaccess\.com\//.test(location)) console.log(`custom domain: protected by Cloudflare Access (${front.status})`);
          else if (front.ok && (await front.text()).includes('id="root"')) console.log("custom domain: dashboard served");
          else { console.error(`custom domain: unexpected answer ${front.status} ${location.slice(0, 80)}`); process.exit(1); }
          const page = await get(ORIGIN + "/");
          const html = page ? await page.text() : "";
          if (!/<!doctype html>/i.test(html) || !html.includes('id="root"')) { console.error(`dashboard page not served (HTTP ${page?.status ?? "no answer"}, ${page?.headers.get("content-type") ?? "-"}, final URL ${page ? new URL(page.url).origin + new URL(page.url).pathname : "-"})`); process.exit(1); }
          const script = html.match(/src="(\/assets\/[^"]+\.js)"/);
          // The hashed bundle can lag the page by a minute at the edge right after a deploy (run 227, 2026-11-26): wait up to ~2 min.
          if (!script || !(await get(ORIGIN + script[1], 40))) { console.error("dashboard bundle not served"); process.exit(1); }
          const status = await get(ORIGIN + "/api/status");
          if (!status) { console.error("/api/status proxy failed"); process.exit(1); }
          console.log(JSON.stringify(await status.json(), null, 2).slice(0, 2000));
          // Chart data via the MARKET_DATA RPC binding (market-data Worker may still be deploying: retry).
          let chart = null;
          for (let i = 0; i < 12 && !chart; i++) {
            try {
              const r = await fetch(ORIGIN + "/api/ohlcv?timeframe=H1&limit=50", { signal: AbortSignal.timeout(20000) });
              const body = await r.json().catch(() => null);
              if (r.ok && Array.isArray(body?.candles) && body.candles.length > 0) chart = body;
              else console.log("ohlcv not ready:", r.status, JSON.stringify(body).slice(0, 300));
            } catch (e) { console.log("ohlcv fetch error:", e?.name); }
            if (!chart) await new Promise(r => setTimeout(r, 10000));
          }
          if (!chart) { console.error("/api/ohlcv returned no candles"); process.exit(1); }
          // The Aether page (hardening 2026-11-09): Aether's overview through the AETHER binding, its sync
          // checks, and never a price.
          let aether = null;
          for (let i = 0; i < 6 && !aether; i++) {
            try {
              const r = await fetch(ORIGIN + "/api/aether/overview", { signal: AbortSignal.timeout(20000) });
              const body = await r.json().catch(() => null);
              if (r.ok && body?.canon?.content_sha256 && body?.sync?.checks) aether = body; else console.log("aether overview not ready:", r.status, JSON.stringify(body).slice(0, 200));
            } catch (e) { console.log("aether overview error:", e?.name); }
            if (!aether) await new Promise(r => setTimeout(r, 10000));
          }
          if (!aether) { console.error("/api/aether/overview did not answer with the canon and the sync checks"); process.exit(1); }
          if (/"(entry_price|stop_loss|take_profit|entry|stop|tp1)"\s*:/.test(JSON.stringify(aether))) { console.error("the Aether overview carries a price field"); process.exit(1); }
          console.log(JSON.stringify({ aether: { canon: aether.canon.content_sha256.slice(0, 12), sync: aether.sync.overall, checks: Object.fromEntries(Object.entries(aether.sync.checks).map(([k, c]) => [k, c.status])) } }));
          const last = chart.candles.at(-1);
          console.log(JSON.stringify({ chart: { symbol: chart.symbol, timeframe: chart.timeframe, count: chart.count, latest_close_time: chart.latest_close_time, last_close: last.close } }));
          NODE

      - name: Smoke test the Liquidity view
        # Track C2 (the Intelligence Liquidity page): GET /api/liquidity through the Nexus proxy answers 200 JSON with
        # no-store under the CI service token (cryptophys.liquidity-view.v1), and the Access login redirect without it.
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          node --input-type=module <<'NODE'
          import { accessToken, isAccessLogin } from "./scripts/access-token.mjs";
          const URL_ = "https://nexus.cryptophys.work/api/liquidity";
          const token = accessToken();
          if (token.problems.length || !token.headers) { console.error(`CF_ACCESS_CLIENT_ID/SECRET: ${token.problems.join("; ") || "not set"} (${token.shape})`); process.exit(1); }
          // Without the token: Cloudflare Access answers with its login redirect, never the view.
          const bare = await fetch(URL_, { redirect: "manual", signal: AbortSignal.timeout(20000) });
          if (!isAccessLogin(bare)) { console.error(`/api/liquidity without the token: expected the Access login redirect, got ${bare.status}`); process.exit(1); }
          console.log(`/api/liquidity without the token: Access login redirect (${bare.status})`);
          // With the token: 200 JSON, no-store, the view's schema (the AI Worker may still be deploying: retry for up to
          // 5 minutes, 30 x 10 s; B9's deploy on 2026-11-23 raced it at 6 x 10 s and got a 404).
          let r = null, body = null;
          for (let i = 0; i < 30; i++) {
            try {
              r = await fetch(URL_, { redirect: "manual", headers: token.headers, signal: AbortSignal.timeout(20000) });
              body = await r.json().catch(() => null);
              if (r.status === 200) break;
              console.log("liquidity view not ready:", r.status, JSON.stringify(body).slice(0, 200));
            } catch (e) { console.log("liquidity view error:", e?.name); }
            await new Promise((res) => setTimeout(res, 10000));
          }
          if (!r || r.status !== 200) { console.error(`/api/liquidity: HTTP ${r?.status ?? "no answer"} ${JSON.stringify(body).slice(0, 200)}`); process.exit(1); }
          if (!/\bjson\b/i.test(r.headers.get("content-type") ?? "")) { console.error(`/api/liquidity: not JSON (${r.headers.get("content-type")})`); process.exit(1); }
          if (!/no-store/i.test(r.headers.get("cache-control") ?? "")) { console.error(`/api/liquidity: cache-control ${r.headers.get("cache-control")}, expected no-store`); process.exit(1); }
          if (body?.schema !== "cryptophys.liquidity-view.v1") { console.error(`/api/liquidity: schema ${body?.schema}`); process.exit(1); }
          console.log(JSON.stringify({ liquidity: { schema: body.schema, on: body.state?.on ?? null, fresh: body.state?.fresh ?? null, levels: Array.isArray(body.levels) ? body.levels.length : null, basis_known: body.scale?.feed_basis_known ?? null } }));
          NODE

      - name: Smoke test the Chart patterns view
        # Track B9 and C3 (the Intelligence Chart patterns page, #/patterns, and its read): GET /api/chart-patterns through
        # the Nexus proxy answers 200 JSON with no-store under the CI service token (cryptophys.chart-patterns-view.v1, the
        # schema of test/fixtures/nexus-intel/chart-patterns.json), and the Access login redirect without it.
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          node --input-type=module <<'NODE'
          import { accessToken, isAccessLogin } from "./scripts/access-token.mjs";
          const URL_ = "https://nexus.cryptophys.work/api/chart-patterns";
          const token = accessToken();
          if (token.problems.length || !token.headers) { console.error(`CF_ACCESS_CLIENT_ID/SECRET: ${token.problems.join("; ") || "not set"} (${token.shape})`); process.exit(1); }
          // Without the token: Cloudflare Access answers with its login redirect, never the view.
          const bare = await fetch(URL_, { redirect: "manual", signal: AbortSignal.timeout(20000) });
          if (!isAccessLogin(bare)) { console.error(`/api/chart-patterns without the token: expected the Access login redirect, got ${bare.status}`); process.exit(1); }
          console.log(`/api/chart-patterns without the token: Access login redirect (${bare.status})`);
          // With the token: 200 JSON, no-store, the view's schema (the AI Worker may still be deploying: retry for up to
          // 5 minutes, 30 x 10 s; B9's deploy on 2026-11-23 raced it at 6 x 10 s and got a 404).
          let r = null, body = null;
          for (let i = 0; i < 30; i++) {
            try {
              r = await fetch(URL_, { redirect: "manual", headers: token.headers, signal: AbortSignal.timeout(20000) });
              body = await r.json().catch(() => null);
              if (r.status === 200) break;
              console.log("chart patterns view not ready:", r.status, JSON.stringify(body).slice(0, 200));
            } catch (e) { console.log("chart patterns view error:", e?.name); }
            await new Promise((res) => setTimeout(res, 10000));
          }
          if (!r || r.status !== 200) { console.error(`/api/chart-patterns: HTTP ${r?.status ?? "no answer"} ${JSON.stringify(body).slice(0, 200)}`); process.exit(1); }
          if (!/\bjson\b/i.test(r.headers.get("content-type") ?? "")) { console.error(`/api/chart-patterns: not JSON (${r.headers.get("content-type")})`); process.exit(1); }
          if (!/no-store/i.test(r.headers.get("cache-control") ?? "")) { console.error(`/api/chart-patterns: cache-control ${r.headers.get("cache-control")}, expected no-store`); process.exit(1); }
          if (body?.schema !== "cryptophys.chart-patterns-view.v1") { console.error(`/api/chart-patterns: schema ${body?.schema}`); process.exit(1); }
          console.log(JSON.stringify({ chart_patterns: { schema: body.schema, mode: body.mode ?? null, patterns: Array.isArray(body.patterns) ? body.patterns.length : null, far_targets: Array.isArray(body.far_targets) ? body.far_targets.length : null, calibrated: body.calibration?.computed_at ?? null } }));
          NODE

      - name: Smoke test the Zones view
        # ZN1 (the Intelligence Zones page, #/zones, and its read): GET /api/zones through the Nexus proxy answers 200 JSON
        # with no-store under the CI service token (cryptophys.zones-view.v1, the schema of test/fixtures/nexus-zones/
        # zones.json), and the Access login redirect without it. ZONE_READINGS is an owner switch (FS1): its 404
        # { status: "not_found", reason: "zone_readings_off" } is the page's off state, a pass.
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          node --input-type=module <<'NODE'
          import { accessToken, isAccessLogin } from "./scripts/access-token.mjs";
          const URL_ = "https://nexus.cryptophys.work/api/zones";
          const token = accessToken();
          if (token.problems.length || !token.headers) { console.error(`CF_ACCESS_CLIENT_ID/SECRET: ${token.problems.join("; ") || "not set"} (${token.shape})`); process.exit(1); }
          // Without the token: Cloudflare Access answers with its login redirect, never the view.
          const bare = await fetch(URL_, { redirect: "manual", signal: AbortSignal.timeout(20000) });
          if (!isAccessLogin(bare)) { console.error(`/api/zones without the token: expected the Access login redirect, got ${bare.status}`); process.exit(1); }
          console.log(`/api/zones without the token: Access login redirect (${bare.status})`);
          // With the token: 200 JSON, no-store, the view's schema, or the 404 of ZONE_READINGS off (the AI Worker may still be
          // deploying: retry for up to 5 minutes, 30 x 10 s, as the other views).
          let r = null, body = null;
          const off = () => r?.status === 404 && body?.status === "not_found" && body?.reason === "zone_readings_off";
          for (let i = 0; i < 30; i++) {
            try {
              r = await fetch(URL_, { redirect: "manual", headers: token.headers, signal: AbortSignal.timeout(20000) });
              body = await r.json().catch(() => null);
              if (r.status === 200 || off()) break;
              console.log("zones view not ready:", r.status, JSON.stringify(body).slice(0, 200));
            } catch (e) { console.log("zones view error:", e?.name); }
            await new Promise((res) => setTimeout(res, 10000));
          }
          if (off()) { console.log(JSON.stringify({ zones: { status: 404, reason: body.reason } })); process.exit(0); }
          if (!r || r.status !== 200) { console.error(`/api/zones: HTTP ${r?.status ?? "no answer"} ${JSON.stringify(body).slice(0, 200)}`); process.exit(1); }
          if (!/\bjson\b/i.test(r.headers.get("content-type") ?? "")) { console.error(`/api/zones: not JSON (${r.headers.get("content-type")})`); process.exit(1); }
          if (!/no-store/i.test(r.headers.get("cache-control") ?? "")) { console.error(`/api/zones: cache-control ${r.headers.get("cache-control")}, expected no-store`); process.exit(1); }
          if (body?.schema !== "cryptophys.zones-view.v1") { console.error(`/api/zones: schema ${body?.schema}`); process.exit(1); }
          console.log(JSON.stringify({ zones: { schema: body.schema, readings: Array.isArray(body.readings) ? body.readings.length : null, breaker: body.breaker ? { checked_at: body.breaker.checked_at ?? null, held: Array.isArray(body.breaker.held) ? body.breaker.held.map((h) => h?.rule) : null } : null, stances: Array.isArray(body.stances) ? body.stances.length : null } }));
          NODE

      - name: Smoke test the Opening range view
        # Track B14 and C4 (the Intelligence Opening range page, #/orb, and its read): GET /api/orb through the Nexus proxy
        # answers 200 JSON with no-store under the CI service token (cryptophys.orb-view.v1, the schema of
        # test/fixtures/nexus-intel/orb.json, every price the feed's), and the Access login redirect without it.
        # INTEL_VIEWS is an AI Worker switch: its 404 { status: "not_found", reason: "intel_views_off" } is the page's off
        # state, a pass.
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          node --input-type=module <<'NODE'
          import { accessToken, isAccessLogin } from "./scripts/access-token.mjs";
          const URL_ = "https://nexus.cryptophys.work/api/orb";
          const token = accessToken();
          if (token.problems.length || !token.headers) { console.error(`CF_ACCESS_CLIENT_ID/SECRET: ${token.problems.join("; ") || "not set"} (${token.shape})`); process.exit(1); }
          // Without the token: Cloudflare Access answers with its login redirect, never the view.
          const bare = await fetch(URL_, { redirect: "manual", signal: AbortSignal.timeout(20000) });
          if (!isAccessLogin(bare)) { console.error(`/api/orb without the token: expected the Access login redirect, got ${bare.status}`); process.exit(1); }
          console.log(`/api/orb without the token: Access login redirect (${bare.status})`);
          // With the token: 200 JSON, no-store, the view's schema, or the 404 of INTEL_VIEWS off (the AI Worker may still be
          // deploying: retry for up to 5 minutes, 30 x 10 s, as the other views).
          let r = null, body = null;
          const off = () => r?.status === 404 && body?.status === "not_found" && body?.reason === "intel_views_off";
          for (let i = 0; i < 30; i++) {
            try {
              r = await fetch(URL_, { redirect: "manual", headers: token.headers, signal: AbortSignal.timeout(20000) });
              body = await r.json().catch(() => null);
              if (r.status === 200 || off()) break;
              console.log("orb view not ready:", r.status, JSON.stringify(body).slice(0, 200));
            } catch (e) { console.log("orb view error:", e?.name); }
            await new Promise((res) => setTimeout(res, 10000));
          }
          if (off()) { console.log(JSON.stringify({ orb: { status: 404, reason: body.reason } })); process.exit(0); }
          if (!r || r.status !== 200) { console.error(`/api/orb: HTTP ${r?.status ?? "no answer"} ${JSON.stringify(body).slice(0, 200)}`); process.exit(1); }
          if (!/\bjson\b/i.test(r.headers.get("content-type") ?? "")) { console.error(`/api/orb: not JSON (${r.headers.get("content-type")})`); process.exit(1); }
          if (!/no-store/i.test(r.headers.get("cache-control") ?? "")) { console.error(`/api/orb: cache-control ${r.headers.get("cache-control")}, expected no-store`); process.exit(1); }
          if (body?.schema !== "cryptophys.orb-view.v1") { console.error(`/api/orb: schema ${body?.schema}`); process.exit(1); }
          if (body?.scale?.prices !== "feed") { console.error(`/api/orb: scale.prices ${body?.scale?.prices}, expected feed`); process.exit(1); }
          const card = (s) => (s ? { phase: s.phase ?? null, status: s.status ?? null, breakout: s.breakout?.side ?? null } : null);
          console.log(JSON.stringify({ orb: { schema: body.schema, mode: body.mode ?? null, levels_mode: body.levels_mode ?? null, market_open: body.market?.open ?? null, london: card(body.sessions?.london), new_york: card(body.sessions?.new_york), recent: Array.isArray(body.recent) ? body.recent.length : null } }));
          NODE

      - name: Smoke test the Position Manager lines
        # C5 (the Omega page's Position Manager lines, B5's read): GET /api/omega/position-manager?limit=1 through the Nexus
        # proxy answers 200 JSON with no-store under the CI service token, with the 17 lines of PM_LINES, each with B5's
        # fields, and the Access login redirect without it. Read only: the panel's POST is the owner's alone.
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          node --input-type=module <<'NODE'
          import { accessToken, isAccessLogin } from "./scripts/access-token.mjs";
          import { PM_LINES } from "./src/pm-line-breaker.mjs";
          const URL_ = "https://nexus.cryptophys.work/api/omega/position-manager?limit=1";
          const token = accessToken();
          if (token.problems.length || !token.headers) { console.error(`CF_ACCESS_CLIENT_ID/SECRET: ${token.problems.join("; ") || "not set"} (${token.shape})`); process.exit(1); }
          // Without the token: Cloudflare Access answers with its login redirect, never the lines.
          const bare = await fetch(URL_, { redirect: "manual", signal: AbortSignal.timeout(20000) });
          if (!isAccessLogin(bare)) { console.error(`/api/omega/position-manager without the token: expected the Access login redirect, got ${bare.status}`); process.exit(1); }
          console.log(`/api/omega/position-manager without the token: Access login redirect (${bare.status})`);
          // With the token: 200 JSON, no-store, the lines (the AI Worker may still be deploying: retry for up to 5 minutes).
          let r = null, body = null;
          for (let i = 0; i < 30; i++) {
            try {
              r = await fetch(URL_, { redirect: "manual", headers: token.headers, signal: AbortSignal.timeout(20000) });
              body = await r.json().catch(() => null);
              if (r.status === 200 && Array.isArray(body?.lines)) break;
              console.log("position manager lines not ready:", r.status, JSON.stringify(body).slice(0, 200));
            } catch (e) { console.log("position manager lines error:", e?.name); }
            await new Promise((res) => setTimeout(res, 10000));
          }
          if (!r || r.status !== 200) { console.error(`/api/omega/position-manager: HTTP ${r?.status ?? "no answer"} ${JSON.stringify(body).slice(0, 200)}`); process.exit(1); }
          if (!/\bjson\b/i.test(r.headers.get("content-type") ?? "")) { console.error(`/api/omega/position-manager: not JSON (${r.headers.get("content-type")})`); process.exit(1); }
          if (!/no-store/i.test(r.headers.get("cache-control") ?? "")) { console.error(`/api/omega/position-manager: cache-control ${r.headers.get("cache-control")}, expected no-store`); process.exit(1); }
          const lines = Array.isArray(body?.lines) ? body.lines : null;
          if (!lines) { console.error(`/api/omega/position-manager: no lines (${JSON.stringify(body?.error ?? null)})`); process.exit(1); }
          const keys = ["id", "version", "enabled", "off_since", "closes", "mean_r_last15", "r_vs_hold"];
          const bad = lines.filter((l) => JSON.stringify(Object.keys(l ?? {})) !== JSON.stringify(keys));
          if (lines.length !== PM_LINES.length || bad.length) { console.error(`/api/omega/position-manager: ${lines.length} lines (want ${PM_LINES.length}), ${bad.length} not in B5's shape`); process.exit(1); }
          console.log(JSON.stringify({ pm_lines: { n: lines.length, off: lines.filter((l) => !l.enabled).map((l) => `${l.id}@${l.version}${l.off_since == null ? " (switch)" : ""}`) } }));
          NODE

      - name: Smoke test the Call for Councils archive
        # CF2 (the Councils page, #/councils, #681): GET /api/council/archive through the Nexus proxy, scope=active (the
        # page's default view) and scope=archive (the ended chains), answers 200 JSON with no-store under the CI service
        # token: items an array and counts.by_status (#680), and no email address and no price-like number in the body ("@" alone
          # is not one: topic keys carry it, e.g. strategy:zone_pullback@intraday, seat:risk@15). The
        # route answers 200 whatever CFC_MODE is (off is an empty or frozen archive, not an error). Without the token:
        # the Access login redirect. And (CF2a, #682) Omega's whoami under the same token answers can_control false and
        # is_owner false: the CI token is never the owner.
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          node --input-type=module <<'NODE'
          import { accessToken, isAccessLogin } from "./scripts/access-token.mjs";
          const BASE = "https://nexus.cryptophys.work/api/council/archive";
          const token = accessToken();
          if (token.problems.length || !token.headers) { console.error(`CF_ACCESS_CLIENT_ID/SECRET: ${token.problems.join("; ") || "not set"} (${token.shape})`); process.exit(1); }
          // Without the token: Cloudflare Access answers with its login redirect, never the archive.
          const bare = await fetch(`${BASE}?scope=active`, { redirect: "manual", signal: AbortSignal.timeout(20000) });
          if (!isAccessLogin(bare)) { console.error(`/api/council/archive without the token: expected the Access login redirect, got ${bare.status}`); process.exit(1); }
          console.log(`/api/council/archive without the token: Access login redirect (${bare.status})`);
          // An email address (a local part, "@", a domain with a dot), and a price-like number (a gold price: four digits, a
          // decimal point) anywhere in the body.
          const EMAIL = /[A-Za-z0-9._%+-]+@[A-Za-z0-9-]+(\.[A-Za-z0-9-]+)*\.[A-Za-z]{2,}/;
          const PRICE = /\b[1-9]\d{3}\.\d{1,3}\b/;
          const out = {};
          for (const scope of ["active", "archive"]) {
            const url = `${BASE}?scope=${scope}&limit=50`;
            // With the token: 200 JSON, no-store (the AI Worker may still be deploying: retry for up to 5 minutes).
            let r = null, text = "", body = null;
            for (let i = 0; i < 30; i++) {
              try {
                r = await fetch(url, { redirect: "manual", headers: token.headers, signal: AbortSignal.timeout(20000) });
                text = await r.text();
                try { body = JSON.parse(text); } catch { body = null; }
                if (r.status === 200 && Array.isArray(body?.items)) break;
                console.log(`council archive (${scope}) not ready:`, r.status, text.slice(0, 200));
              } catch (e) { console.log(`council archive (${scope}) error:`, e?.name); }
              await new Promise((res) => setTimeout(res, 10000));
            }
            if (!r || r.status !== 200) { console.error(`/api/council/archive?scope=${scope}: HTTP ${r?.status ?? "no answer"} ${text.slice(0, 200)}`); process.exit(1); }
            if (!/\bjson\b/i.test(r.headers.get("content-type") ?? "")) { console.error(`/api/council/archive?scope=${scope}: not JSON (${r.headers.get("content-type")})`); process.exit(1); }
            if (!/no-store/i.test(r.headers.get("cache-control") ?? "")) { console.error(`/api/council/archive?scope=${scope}: cache-control ${r.headers.get("cache-control")}, expected no-store`); process.exit(1); }
            if (!Array.isArray(body?.items)) { console.error(`/api/council/archive?scope=${scope}: items is not an array`); process.exit(1); }
            const byStatus = body?.counts?.by_status;
            if (!byStatus || typeof byStatus !== "object") { console.error(`/api/council/archive?scope=${scope}: no counts.by_status`); process.exit(1); }
            const email = text.match(EMAIL);
            if (email) { console.error(`/api/council/archive?scope=${scope}: an email address in the body (${email[0].replace(/^[^@]*/, "…")})`); process.exit(1); }
            const price = text.match(PRICE);
            if (price) { console.error(`/api/council/archive?scope=${scope}: a price-like number in the body (${price[0]})`); process.exit(1); }
            out[scope] = { items: body.items.length, total: body.counts.total ?? null, active: body.counts.active ?? null, archive: body.counts.archive ?? null, by_status: byStatus };
          }
          console.log(JSON.stringify({ council_archive: out }));
          // CF2a (#682): the Councils page shows owner controls only to the owner. The CI service token is never the
          // owner: Omega's whoami answers can_control false and is_owner false for it (its subject is not printed).
          const WHOAMI = "https://nexus.cryptophys.work/omega/api/whoami";
          let w = null, who = null;
          for (let i = 0; i < 30; i++) {
            try {
              w = await fetch(WHOAMI, { redirect: "manual", headers: token.headers, signal: AbortSignal.timeout(20000) });
              who = await w.json().catch(() => null);
              if (w.status === 200 && who && typeof who.can_control === "boolean") break;
              console.log("whoami not ready:", w.status, typeof who?.can_control);
            } catch (e) { console.log("whoami error:", e?.name); }
            await new Promise((res) => setTimeout(res, 10000));
          }
          if (!w || w.status !== 200) { console.error(`/omega/api/whoami: HTTP ${w?.status ?? "no answer"}`); process.exit(1); }
          if (who?.can_control !== false || who?.is_owner !== false) { console.error(`/omega/api/whoami: the CI service token is not a viewer (can_control ${who?.can_control}, is_owner ${who?.is_owner})`); process.exit(1); }
          console.log(JSON.stringify({ whoami_ci: { type: who.type ?? null, can_control: who.can_control, is_owner: who.is_owner } }));
          NODE
