name: Deploy Nexus Dashboard Worker

# Deploys `xauusd-nexus-dashboard` (nexus.cryptophys.work) on main. The dashboard is a React SPA
# in the Cerebrum Console obsidian design (ui/, built into ui/dist and served as Workers Static
# Assets) plus read-only /api/* routes, so it needs no secrets beyond CLOUDFLARE_API_TOKEN.
on:
  push:
    branches: [main]
    paths:
      - "workers/xauusd-nexus-dashboard/**"
      - ".github/workflows/deploy-nexus-dashboard.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-nexus-dashboard
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Require Cloudflare deploy credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then echo "::error::CLOUDFLARE_API_TOKEN is not configured."; exit 1; fi

      - name: Build the Nexus UI
        working-directory: workers/xauusd-nexus-dashboard/ui
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Validate Worker bundle
        run: npx --yes wrangler@4.45.0 deploy --dry-run --config workers/xauusd-nexus-dashboard/wrangler.jsonc

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4.45.0 deploy --config workers/xauusd-nexus-dashboard/wrangler.jsonc

      - name: Smoke test
        run: |
          node --input-type=module <<'NODE'
          const get = async (u) => { for (let i = 0; i < 10; i++) { try { const r = await fetch(u, { signal: AbortSignal.timeout(20000) }); if (r.ok) return r; } catch {} await new Promise(r => setTimeout(r, 3000)); } return null; };
          const page = await get("https://nexus.cryptophys.work/");
          const html = page ? await page.text() : "";
          if (!/<!doctype html>/i.test(html) || !html.includes('id="root"')) { console.error("dashboard page not served"); process.exit(1); }
          const script = html.match(/src="(\/assets\/[^"]+\.js)"/);
          if (!script || !(await get("https://nexus.cryptophys.work" + script[1]))) { console.error("dashboard bundle not served"); process.exit(1); }
          const status = await get("https://nexus.cryptophys.work/api/status");
          if (!status) { console.error("/api/status proxy failed"); process.exit(1); }
          console.log(JSON.stringify(await status.json(), null, 2).slice(0, 2000));
          // Chart data via the MARKET_DATA RPC binding (market-data Worker may still be deploying: retry).
          let chart = null;
          for (let i = 0; i < 12 && !chart; i++) {
            try {
              const r = await fetch("https://nexus.cryptophys.work/api/ohlcv?timeframe=H1&limit=50", { signal: AbortSignal.timeout(20000) });
              const body = await r.json().catch(() => null);
              if (r.ok && Array.isArray(body?.candles) && body.candles.length > 0) chart = body;
              else console.log("ohlcv not ready:", r.status, JSON.stringify(body).slice(0, 300));
            } catch (e) { console.log("ohlcv fetch error:", e?.name); }
            if (!chart) await new Promise(r => setTimeout(r, 10000));
          }
          if (!chart) { console.error("/api/ohlcv returned no candles"); process.exit(1); }
          const last = chart.candles.at(-1);
          console.log(JSON.stringify({ chart: { symbol: chart.symbol, timeframe: chart.timeframe, count: chart.count, latest_close_time: chart.latest_close_time, last_close: last.close } }));
          NODE
