name: Deploy Nexus Dashboard Worker

# Deploys `xauusd-nexus-dashboard` (nexus.cryptophys.work) on main. The dashboard is a React SPA
# in the Cerebrum Console obsidian design (ui/, built into ui/dist and served as Workers Static
# Assets) plus read-only /api/* routes, so it needs no secrets beyond CLOUDFLARE_API_TOKEN.
on:
  push:
    branches: [main]
    paths:
      - "workers/xauusd-nexus-dashboard/**"
      - ".github/workflows/deploy-nexus-dashboard.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-nexus-dashboard
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Require Cloudflare deploy credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then echo "::error::CLOUDFLARE_API_TOKEN is not configured."; exit 1; fi

      - name: Build the Nexus UI
        working-directory: workers/xauusd-nexus-dashboard/ui
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Validate Worker bundle
        run: npx --yes wrangler@4.45.0 deploy --dry-run --config workers/xauusd-nexus-dashboard/wrangler.jsonc

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4.45.0 deploy --config workers/xauusd-nexus-dashboard/wrangler.jsonc

      - name: Smoke test
        # nexus.cryptophys.work is behind Cloudflare Access (owner, 2026-11-07): without credentials it
        # answers with the Access login redirect, which the first check requires. Every content check
        # runs against the custom domain with the CI service token (repository secrets
        # CF_ACCESS_CLIENT_ID and CF_ACCESS_CLIENT_SECRET); Nexus has no workers.dev address.
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          node --input-type=module <<'NODE'
          import { accessToken, isAccessLogin } from "./scripts/access-token.mjs";
          const DOMAIN = "https://nexus.cryptophys.work";
          // Normalised like the platform's access-headers.sh; problems are reported by shape, never by value.
          const token = accessToken();
          if (token.problems.length) { console.error(`CF_ACCESS_CLIENT_ID/SECRET: ${token.problems.join("; ")} (${token.shape})`); process.exit(1); }
          const TOKEN = token.headers;
          // workers.dev is disabled (owner, 2026-11-07): the content checks need the CI service token.
          if (!TOKEN) { console.error("CF_ACCESS_CLIENT_ID/CF_ACCESS_CLIENT_SECRET are required: Nexus has no public workers.dev address"); process.exit(1); }
          const ORIGIN = DOMAIN;
          const nativeFetch = globalThis.fetch;
          const fetch = (u, init = {}) => nativeFetch(u, TOKEN && String(u).startsWith(ORIGIN) ? { ...init, headers: { ...(init.headers || {}), ...TOKEN } } : init);
          console.log("using the CI service token against the custom domain");
          // The token must get past Access itself: without following redirects, a refusal is a 302 to the login page.
          const admitted = await nativeFetch(DOMAIN + "/", { redirect: "manual", headers: TOKEN, signal: AbortSignal.timeout(20000) });
          if (isAccessLogin(admitted)) { console.error(`Cloudflare Access refused the CI service token (${token.shape}). Set CF_ACCESS_CLIENT_ID and CF_ACCESS_CLIENT_SECRET to the cryptophys-ci Client ID and its current Client Secret`); process.exit(1); }
          console.log(`service token admitted by Access (HTTP ${admitted.status})`);
          const get = async (u) => { for (let i = 0; i < 10; i++) { try { const r = await fetch(u, { signal: AbortSignal.timeout(20000) }); if (r.ok) return r; } catch {} await new Promise(r => setTimeout(r, 3000)); } return null; };
          let front = null;
          for (let i = 0; i < 10 && !front; i++) { try { front = await nativeFetch(DOMAIN + "/", { redirect: "manual", signal: AbortSignal.timeout(20000) }); } catch { await new Promise(r => setTimeout(r, 3000)); } }
          if (!front) { console.error("custom domain did not answer"); process.exit(1); }
          const location = front.headers.get("location") || "";
          if (front.status >= 300 && front.status < 400 && /^https:\/\/[a-z0-9-]+\.cloudflareaccess\.com\//.test(location)) console.log(`custom domain: protected by Cloudflare Access (${front.status})`);
          else if (front.ok && (await front.text()).includes('id="root"')) console.log("custom domain: dashboard served");
          else { console.error(`custom domain: unexpected answer ${front.status} ${location.slice(0, 80)}`); process.exit(1); }
          const page = await get(ORIGIN + "/");
          const html = page ? await page.text() : "";
          if (!/<!doctype html>/i.test(html) || !html.includes('id="root"')) { console.error(`dashboard page not served (HTTP ${page?.status ?? "no answer"}, ${page?.headers.get("content-type") ?? "-"}, final URL ${page ? new URL(page.url).origin + new URL(page.url).pathname : "-"})`); process.exit(1); }
          const script = html.match(/src="(\/assets\/[^"]+\.js)"/);
          if (!script || !(await get(ORIGIN + script[1]))) { console.error("dashboard bundle not served"); process.exit(1); }
          const status = await get(ORIGIN + "/api/status");
          if (!status) { console.error("/api/status proxy failed"); process.exit(1); }
          console.log(JSON.stringify(await status.json(), null, 2).slice(0, 2000));
          // Chart data via the MARKET_DATA RPC binding (market-data Worker may still be deploying: retry).
          let chart = null;
          for (let i = 0; i < 12 && !chart; i++) {
            try {
              const r = await fetch(ORIGIN + "/api/ohlcv?timeframe=H1&limit=50", { signal: AbortSignal.timeout(20000) });
              const body = await r.json().catch(() => null);
              if (r.ok && Array.isArray(body?.candles) && body.candles.length > 0) chart = body;
              else console.log("ohlcv not ready:", r.status, JSON.stringify(body).slice(0, 300));
            } catch (e) { console.log("ohlcv fetch error:", e?.name); }
            if (!chart) await new Promise(r => setTimeout(r, 10000));
          }
          if (!chart) { console.error("/api/ohlcv returned no candles"); process.exit(1); }
          const last = chart.candles.at(-1);
          console.log(JSON.stringify({ chart: { symbol: chart.symbol, timeframe: chart.timeframe, count: chart.count, latest_close_time: chart.latest_close_time, last_close: last.close } }));
          NODE
