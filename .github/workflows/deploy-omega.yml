name: Deploy Omega Execution Engine Worker

# Deploys `xauusd-omega` (omega.cryptophys.work, owner decisions 2026-11-09) on main. A static page
# plus /api/* routes that reach the AI Worker's OmegaGateway entrypoint over a Service Binding. The
# Worker verifies the Cloudflare Access JWT itself (fail closed): ACCESS_AUD is resolved here when
# the deploy token can read Access applications (or the optional secret CLOUDFLARE_ACCESS_API_TOKEN),
# otherwise the audience is not checked and the signature, issuer and expiry still are.
on:
  push:
    branches: [main]
    paths:
      - "workers/xauusd-omega/**"
      - ".github/workflows/deploy-omega.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-omega
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Require Cloudflare deploy credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then echo "::error::CLOUDFLARE_API_TOKEN is not configured."; exit 1; fi

      - name: Test the Omega Worker
        run: node --test test/omega-worker.test.mjs

      - name: Resolve the Access audience (best effort)
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_ACCESS_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -uo pipefail
          api() { curl --silent --show-error --proto '=https' --max-time 20 --retry 3 --header "Authorization: Bearer ${TOKEN}" "https://api.cloudflare.com/client/v4$1"; }
          account="$(api /accounts | jq -r 'if .success then (.result | if length == 1 then .[0].id else empty end) else empty end' 2>/dev/null || true)"
          aud=""
          if [ -n "$account" ]; then
            aud="$(api "/accounts/${account}/access/apps?per_page=1000" | jq -r '[.result[]? | select(.name == "cryptophys-cloud-platform")] | if length == 1 then .[0].aud else empty end' 2>/dev/null || true)"
          fi
          if [[ "$aud" =~ ^[0-9a-f]{64}$ ]]; then
            echo "ACCESS_AUD=${aud}" >> "$GITHUB_ENV"
            echo "Access audience resolved: the Worker checks it."
          else
            echo "::warning::The Access audience could not be resolved (the token cannot read Access applications). The Worker still verifies the JWT signature, issuer and expiry. Add the secret CLOUDFLARE_ACCESS_API_TOKEN (Access: Apps and Policies Read) to also check the audience."
          fi

      - name: Validate Worker bundle
        run: npx --yes wrangler@4.45.0 deploy --dry-run --config workers/xauusd-omega/wrangler.jsonc

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${ACCESS_AUD:-}" ]; then
            npx --yes wrangler@4.45.0 deploy --config workers/xauusd-omega/wrangler.jsonc --var "ACCESS_AUD:${ACCESS_AUD}"
          else
            npx --yes wrangler@4.45.0 deploy --config workers/xauusd-omega/wrangler.jsonc
          fi

      - name: Smoke test
        # Before the platform's Access application covers omega.cryptophys.work, the Worker itself refuses
        # every request without a JWT (403): that is checked and reported. Once Access covers the host,
        # an anonymous request is sent to the Access login and the CI service token reads the overview.
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          node --input-type=module <<'NODE'
          import { accessToken, isAccessLogin } from "./scripts/access-token.mjs";
          const DOMAIN = "https://omega.cryptophys.work";
          const wait = (ms) => new Promise((r) => setTimeout(r, ms));
          let front = null;
          // A new custom domain can take a minute to answer.
          for (let i = 0; i < 18 && !front; i++) { try { front = await fetch(DOMAIN + "/", { redirect: "manual", signal: AbortSignal.timeout(20000) }); } catch { await wait(10000); } }
          if (!front) { console.error("omega.cryptophys.work did not answer"); process.exit(1); }
          if (isAccessLogin(front)) {
            console.log(`custom domain: protected by Cloudflare Access (${front.status})`);
            const token = accessToken();
            if (token.problems.length || !token.headers) { console.error(`CF_ACCESS_CLIENT_ID/SECRET: ${token.problems.join("; ") || "not set"} (${token.shape})`); process.exit(1); }
            let body = null;
            for (let i = 0; i < 12 && !body; i++) {
              try {
                const r = await fetch(DOMAIN + "/api/overview", { headers: token.headers, signal: AbortSignal.timeout(20000) });
                const j = await r.json().catch(() => null);
                if (r.ok && j?.signal && j?.control) body = j; else console.log("overview not ready:", r.status, JSON.stringify(j).slice(0, 200));
              } catch (e) { console.log("overview error:", e?.name); }
              if (!body) await wait(10000);
            }
            if (!body) { console.error("/api/overview did not answer through the OmegaGateway binding"); process.exit(1); }
            if (body.viewer?.can_control) { console.error("a service token must never be able to change the control"); process.exit(1); }
            console.log(JSON.stringify({ control: body.control.mode, signal: body.signal.side, ea_connected: body.ea?.connected, deals: body.deals?.length }));
            const page = await fetch(DOMAIN + "/", { headers: token.headers, signal: AbortSignal.timeout(20000) });
            const html = await page.text();
            if (!page.ok || !html.includes("Omega")) { console.error(`page not served (HTTP ${page.status})`); process.exit(1); }
            if (!/script-src 'self'/.test(page.headers.get("content-security-policy") || "")) { console.error("page without its CSP"); process.exit(1); }
          } else if (front.status === 403) {
            const j = await front.json().catch(() => null);
            if (j?.error !== "access_denied") { console.error(`unexpected 403 body ${JSON.stringify(j)}`); process.exit(1); }
            console.log("::notice::omega.cryptophys.work is deployed and refuses every request without an Access JWT. Run the platform workflow 'Provision Cloudflare Access' (PROVISION) so Access covers the hostname and the owner can sign in.");
          } else {
            console.error(`custom domain: unexpected answer ${front.status} ${front.headers.get("location") || ""}`.slice(0, 200));
            process.exit(1);
          }
          NODE
