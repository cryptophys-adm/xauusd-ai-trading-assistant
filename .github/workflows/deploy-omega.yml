name: Deploy Omega Execution Engine Worker

# Deploys `xauusd-omega` (omega.cryptophys.work, owner decisions 2026-11-09) on main. A static page
# plus /api/* routes that reach the AI Worker's OmegaGateway entrypoint over a Service Binding. The
# Worker verifies the Cloudflare Access JWT itself (fail closed) and answers no /api/* route without
# ACCESS_AUD. The audience is resolved here: from the Access API when a token can read applications
# (optional secret CLOUDFLARE_ACCESS_API_TOKEN), otherwise from Cloudflare Access's own login redirect
# for nexus.cryptophys.work (its `kid` is the AUD of the platform application, which Omega shares:
# owner 2026-11-09, Omega is reached at nexus.cryptophys.work/omega). Without one, only the empty page
# shell is served.
on:
  push:
    branches: [main]
    paths:
      - "workers/xauusd-omega/**"
      - ".github/workflows/deploy-omega.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-omega
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Require Cloudflare deploy credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then echo "::error::CLOUDFLARE_API_TOKEN is not configured."; exit 1; fi

      - name: Test the Omega Worker
        run: node --test test/omega-worker.test.mjs

      - name: Resolve the Access audience
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_ACCESS_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -uo pipefail
          api() { curl --silent --show-error --proto '=https' --max-time 20 --retry 3 --header "Authorization: Bearer ${TOKEN}" "https://api.cloudflare.com/client/v4$1"; }
          account="$(api /accounts | jq -r 'if .success then (.result | if length == 1 then .[0].id else empty end) else empty end' 2>/dev/null || true)"
          aud=""
          if [ -n "$account" ]; then
            aud="$(api "/accounts/${account}/access/apps?per_page=1000" | jq -r '[.result[]? | select(.name == "cryptophys-cloud-platform")] | if length == 1 then .[0].aud else empty end' 2>/dev/null || true)"
          fi
          source="Access API"
          if ! [[ "$aud" =~ ^[0-9a-f]{64}$ ]]; then
            # Cloudflare Access sends an anonymous visitor of nexus.cryptophys.work (the platform application,
            # which Omega shares) to its login page with the application's AUD as `kid`.
            location="$(curl --silent --proto '=https' --max-time 20 --output /dev/null --write-out '%{redirect_url}' https://nexus.cryptophys.work/ || true)"
            if [[ "$location" =~ ^https://cryptophys\.cloudflareaccess\.com/cdn-cgi/access/login/nexus\.cryptophys\.work\?(.*\&)?kid=([0-9a-f]{64})(\&|$) ]]; then
              aud="${BASH_REMATCH[2]}"; source="the Access login redirect"
            fi
          fi
          if [[ "$aud" =~ ^[0-9a-f]{64}$ ]]; then
            echo "ACCESS_AUD=${aud}" >> "$GITHUB_ENV"
            echo "Access audience resolved from ${source}: the Worker enforces it."
          else
            echo "::error::The Access audience could not be resolved from the Access API or the nexus.cryptophys.work login redirect."
            exit 1
          fi

      - name: Validate Worker bundle
        run: npx --yes wrangler@4.45.0 deploy --dry-run --config workers/xauusd-omega/wrangler.jsonc

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${ACCESS_AUD:-}" ]; then
            npx --yes wrangler@4.45.0 deploy --config workers/xauusd-omega/wrangler.jsonc --var "ACCESS_AUD:${ACCESS_AUD}"
          else
            npx --yes wrangler@4.45.0 deploy --config workers/xauusd-omega/wrangler.jsonc
          fi

      - name: Smoke test
        # Before the platform's Access application covers omega.cryptophys.work, the Worker itself refuses
        # every request without a JWT (403): that is checked and reported. Once Access covers the host,
        # an anonymous request is sent to the Access login and the CI service token reads the overview.
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          node --input-type=module <<'NODE'
          import { accessToken, isAccessLogin } from "./scripts/access-token.mjs";
          const DOMAIN = "https://omega.cryptophys.work";
          const wait = (ms) => new Promise((r) => setTimeout(r, ms));
          let front = null;
          // A new custom domain can take a minute to answer.
          for (let i = 0; i < 18 && !front; i++) { try { front = await fetch(DOMAIN + "/", { redirect: "manual", signal: AbortSignal.timeout(20000) }); } catch { await wait(10000); } }
          if (!front) { console.error("omega.cryptophys.work did not answer"); process.exit(1); }
          if (isAccessLogin(front)) {
            console.log(`custom domain: protected by Cloudflare Access (${front.status})`);
            if (!process.env.ACCESS_AUD) { console.error("Access covers the host but no audience was resolved"); process.exit(1); }
            const token = accessToken();
            if (token.problems.length || !token.headers) { console.error(`CF_ACCESS_CLIENT_ID/SECRET: ${token.problems.join("; ") || "not set"} (${token.shape})`); process.exit(1); }
            // The CI token reads /api/status (the audience matched and the OmegaGateway binding answers)
            // and must be refused EA data.
            let status = null;
            for (let i = 0; i < 12 && !status; i++) {
              try {
                const r = await fetch(DOMAIN + "/api/status", { headers: token.headers, signal: AbortSignal.timeout(20000) });
                const j = await r.json().catch(() => null);
                if (r.ok && j?.status === "ok") status = j; else console.log("status not ready:", r.status, JSON.stringify(j).slice(0, 200));
              } catch (e) { console.log("status error:", e?.name); }
              if (!status) await wait(10000);
            }
            if (!status) { console.error("/api/status did not answer: wrong audience or the OmegaGateway binding is missing"); process.exit(1); }
            console.log(JSON.stringify(status));
            const data = await fetch(DOMAIN + "/api/overview", { headers: token.headers, signal: AbortSignal.timeout(20000) });
            if (data.status !== 403) { console.error(`a service token must not read EA data (HTTP ${data.status})`); process.exit(1); }
            const page = await fetch(DOMAIN + "/", { headers: token.headers, signal: AbortSignal.timeout(20000) });
            const html = await page.text();
            if (!page.ok || !html.includes("Omega")) { console.error(`page not served (HTTP ${page.status})`); process.exit(1); }
            if (!/script-src 'self'/.test(page.headers.get("content-security-policy") || "")) { console.error("page without its CSP"); process.exit(1); }
          } else if (front.status === 403) {
            const j = await front.json().catch(() => null);
            if (j?.error !== "access_denied") { console.error(`unexpected 403 body ${JSON.stringify(j)}`); process.exit(1); }
            console.log("::notice::omega.cryptophys.work is not in Cloudflare Access (Omega is reached at nexus.cryptophys.work/omega): the Worker refuses every request without an Access JWT.");
          } else {
            console.error(`custom domain: unexpected answer ${front.status} ${front.headers.get("location") || ""}`.slice(0, 200));
            process.exit(1);
          }
          NODE
