name: Validate Content Worker

# Pull requests that touch the content engine (xauusd-content): its tests and the Worker bundle
# (no deploy, no secrets).
on:
  pull_request:
    paths:
      - "workers/xauusd-content/**"
      - "src/content-guardian.mjs"
      - "src/public-projection.mjs"
      - "test/content-worker.test.mjs"
      - ".github/workflows/validate-content.yml"
      - ".github/workflows/deploy-content.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test the content engine
        run: node --test test/content-worker.test.mjs test/public-content.test.mjs

      - name: Validate Worker bundle
        run: npx --yes wrangler@4.45.0 deploy --dry-run --config workers/xauusd-content/wrangler.jsonc
