name: Validate Market Data Ingestion Worker

on:
  pull_request:
    paths:
      - "market-data-ingestion/**"
      - "package.json"
      - ".github/workflows/validate-market-data-ingestion.yml"
  push:
    branches:
      - feat/xauusd-market-data-ingestion
    paths:
      - "market-data-ingestion/**"
      - "package.json"
      - ".github/workflows/validate-market-data-ingestion.yml"

permissions:
  contents: read

concurrency:
  group: validate-market-data-ingestion-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Run market data ingestion tests
        run: node --test market-data-ingestion/test/*.test.mjs

      - name: Validate Cloudflare Worker bundle
        run: npx --yes wrangler@4.45.0 deploy --dry-run --config market-data-ingestion/wrangler.jsonc
