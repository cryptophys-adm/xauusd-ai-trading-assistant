name: Set TradingView webhook secret

# Owner request 2026-11-09: after several dashboard edits the TradingView alerts still answered 401;
# the rejection fingerprints showed the alerts sending one 32-character secret and the AI Worker
# holding another. This manual workflow sets the AI Worker's WEBHOOK_SECRET from the GitHub Actions
# secret TV_WEBHOOK_SECRET (paste the same value as the indicators' "CTA Webhook Secret" input there,
# never in chat), byte for byte, then proves it end to end:
#   1. prints the first 8 hex characters of its SHA-256 (the fingerprint D1 webhook_rejections keeps),
#   2. waits until the Worker accepts a body carrying that secret exactly as the Pine payload
#      carries it (`"secret":"<value>"`). The probe uses source "diagnostic_probe", which the Worker
#      refuses only after the secret check (400 Unsupported source), so nothing is stored.
# The value is masked in the log and never printed.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: set-webhook-secret
  cancel-in-progress: false

jobs:
  set-secret:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Set WEBHOOK_SECRET on the AI Worker
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${TV_WEBHOOK_SECRET:-}" ]; then
            echo "The GitHub Actions secret TV_WEBHOOK_SECRET is not set." >&2
            exit 1
          fi
          echo "::add-mask::$TV_WEBHOOK_SECRET"
          printf 'Length: %s characters\n' "$(printf '%s' "$TV_WEBHOOK_SECRET" | wc -c | tr -d ' ')"
          printf 'Fingerprint (sha256, first 8): %s\n' "$(printf '%s' "$TV_WEBHOOK_SECRET" | sha256sum | cut -c1-8)"
          printf '%s' "$TV_WEBHOOK_SECRET" | npx wrangler secret put WEBHOOK_SECRET --name xauusd-ai-trading-assistant >/dev/null
          echo "WEBHOOK_SECRET updated."
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TV_WEBHOOK_SECRET: ${{ secrets.TV_WEBHOOK_SECRET }}
      - name: Prove the Worker accepts the Pine-shaped body
        run: |
          node --input-type=module <<'NODE'
          const secret = process.env.TV_WEBHOOK_SECRET;
          // The same string the indicators build: f_json_escape, then "secret":"<value>" in the body.
          const esc = secret.replaceAll("\\", "\\\\").replaceAll("\"", "\\\"").replaceAll("\n", "\\n").replaceAll("\r", "\\r").replaceAll("\t", "\\t");
          const body = `{"v":1,"source":"diagnostic_probe","src":"diagnostic_probe","ticker":"OANDA:XAUUSD","symbol":"OANDA:XAUUSD","timeframe":"5","tf":"5","candle_time":"0","timestamp":"0","t":0,"secret":"${esc}"}`;
          // A new secret reaches every isolate within seconds to a minute: retry a 401 for up to 3 minutes.
          let last;
          for (let attempt = 1; attempt <= 18; attempt++) {
            const res = await fetch("https://ai.cryptophys.work/webhook", { method: "POST", headers: { "content-type": "text/plain; charset=utf-8", "user-agent": "set-webhook-secret-workflow" }, body });
            last = res.status;
            const text = await res.text();
            if (res.status === 400 && /Unsupported source/.test(text)) {
              console.log(`Accepted: the Worker took the secret (attempt ${attempt}); the probe was refused only as an unsupported source, so nothing was stored.`);
              process.exit(0);
            }
            console.log(`Attempt ${attempt}: HTTP ${res.status}`);
            await new Promise((r) => setTimeout(r, 10_000));
          }
          console.error(`The Worker still answers ${last}: the secret did not take effect.`);
          process.exit(1);
          NODE
        env:
          TV_WEBHOOK_SECRET: ${{ secrets.TV_WEBHOOK_SECRET }}
