name: Deploy and test isolated Evidence Fusion preview

on:
  pull_request:
    paths:
      - "src/**"
      - "test/**"
      - "migrations/**"
      - "schema.sql"
      - "wrangler.jsonc"
      - "wrangler.preview.jsonc"
      - "package.json"
      - ".github/workflows/deploy-preview-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: evidence-fusion-preview
  cancel-in-progress: false

jobs:
  preview-e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Apply preview D1 migration when a D1-scoped token is configured
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${CLOUDFLARE_D1_API_TOKEN:-}" ]; then
            CLOUDFLARE_API_TOKEN="$CLOUDFLARE_D1_API_TOKEN" npx wrangler d1 migrations apply xauusd-signals --remote --config wrangler.preview.jsonc
          else
            echo "Using the pre-provisioned isolated preview D1. The /ready acceptance check will fail if analysis_runs is missing."
          fi
        env:
          CLOUDFLARE_D1_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}

      - name: Deploy isolated preview Worker
        shell: bash
        run: |
          set -euo pipefail
          # Runs are serialized (concurrency group), but a run that failed midway leaves its queue
          # messages behind (War Room, analysis and retries), and the next run's consumer drains them
          # first: on PR #114 the next run's analysis waited past its 90 s window behind them. The
          # Worker of every earlier run is deleted, so its messages can only delay this run.
          npx wrangler queues purge xauusd-webhook-events-preview --force --config wrangler.preview.jsonc || echo "Preview queue purge unavailable; continuing."
          PREVIEW_WORKER_NAME="xauusd-ai-preview-${GITHUB_RUN_ID}"
          echo "PREVIEW_WORKER_NAME=$PREVIEW_WORKER_NAME" >> "$GITHUB_ENV"
          # A brand-new Worker can briefly read back as "does not exist" (code 10007) right after
          # its first upload; retry that eventual-consistency error. A Cloudflare API outage
          # (5xx, "no healthy upstream": PR #115, before any deploy or test ran) is retried too,
          # with a longer backoff (30, 60, 90 s). Every other error fails at once.
          for attempt in 1 2 3 4; do
            set +e
            DEPLOY_OUTPUT="$(npx wrangler deploy --name "$PREVIEW_WORKER_NAME" --config wrangler.preview.jsonc 2>&1)"
            DEPLOY_STATUS=$?
            set -e
            printf '%s\n' "$DEPLOY_OUTPUT"
            if [ "$DEPLOY_STATUS" -eq 0 ] || [ "$attempt" -eq 4 ]; then break; fi
            if printf '%s' "$DEPLOY_OUTPUT" | grep -q 'code: 10007'; then
              echo "Preview deploy hit Cloudflare code 10007 (attempt $attempt); retrying in 10s." >&2
              sleep 10
            elif printf '%s' "$DEPLOY_OUTPUT" | grep -Eq -- '-> 5[0-9]{2} |no healthy upstream'; then
              echo "Cloudflare API unavailable (attempt $attempt); retrying in $((attempt * 30))s." >&2
              sleep $((attempt * 30))
            else
              break
            fi
          done
          if [ "$DEPLOY_STATUS" -ne 0 ]; then
            echo "Preview Worker deployment failed with exit code $DEPLOY_STATUS." >&2
            exit "$DEPLOY_STATUS"
          fi
          PREVIEW_URL="$(printf '%s\n' "$DEPLOY_OUTPUT" | grep -Eo 'https://[^[:space:]]+workers\.dev' | head -n 1 || true)"
          if [ -z "$PREVIEW_URL" ]; then
            echo "Could not resolve the preview workers.dev URL from Wrangler output." >&2
            exit 1
          fi
          echo "PREVIEW_BASE_URL=$PREVIEW_URL" >> "$GITHUB_ENV"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Configure ephemeral preview-only webhook secret
        shell: bash
        run: |
          set -euo pipefail
          PREVIEW_SECRET="$(node -e 'process.stdout.write(require("node:crypto").randomBytes(32).toString("hex"))')"
          echo "::add-mask::$PREVIEW_SECRET"
          echo "PREVIEW_WEBHOOK_SECRET=$PREVIEW_SECRET" >> "$GITHUB_ENV"
          printf '%s' "$PREVIEW_SECRET" | npx wrangler secret put WEBHOOK_SECRET --name "$PREVIEW_WORKER_NAME" --config wrangler.preview.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Run isolated end-to-end degraded-evidence acceptance
        run: |
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";

          const base = process.env.PREVIEW_BASE_URL;
          const secret = process.env.PREVIEW_WEBHOOK_SECRET;
          assert.ok(base && base.startsWith("https://"), "preview URL is required");
          assert.ok(secret, "ephemeral preview secret is required");

          let healthResponse;
          let health;
          let healthParseError = "no response";
          // `wrangler secret put` creates a new Worker version that reaches isolates gradually:
          // wait up to 90 s for /health to see the secret (10 x 1 s was not enough on ede9e9f).
          const healthDeadline = Date.now() + 90_000;
          while (Date.now() < healthDeadline) {
            try {
              healthResponse = await fetch(base + "/health", { signal: AbortSignal.timeout(15000) });
            } catch (error) {
              // A freshly deployed workers.dev route can time out while it propagates; retry instead of failing.
              healthParseError = "fetch failed: " + (error?.name || "error");
              await new Promise(resolve => setTimeout(resolve, 2000));
              continue;
            }
            try {
              health = await healthResponse.clone().json();
              healthParseError = "";
            } catch {
              health = null;
              const body = (await healthResponse.clone().text()).slice(0, 160);
              healthParseError = `/health returned non-JSON HTTP ${healthResponse.status}: ${body}`;
            }
            if (healthResponse.ok && health?.status === "ok" && health.secrets_configured?.webhook_secret === true) break;
            await new Promise(resolve => setTimeout(resolve, 1000));
          }
          assert.ok(health, `health endpoint did not return JSON after retries: ${healthParseError}`);
          assert.equal(healthResponse.status, 200);
          assert.equal(health.status, "ok");
          for (const name of ["d1", "signal_cache", "webhook_buffer", "knowledge_base", "workers_ai"]) {
            assert.equal(health.bindings?.[name], true, "missing preview binding: " + name);
          }
          assert.equal(health.secrets_configured?.webhook_secret, true, "preview secret must be visible to the Worker");
          let readyResponse;
          let ready;
          let readyParseError = "no response";
          for (let attempt = 0; attempt < 10; attempt++) {
            try {
              readyResponse = await fetch(base + "/ready", { signal: AbortSignal.timeout(15000) });
            } catch (error) {
              readyParseError = "fetch failed: " + (error?.name || "error");
              await new Promise(resolve => setTimeout(resolve, 2000));
              continue;
            }
            try {
              ready = await readyResponse.clone().json();
              readyParseError = "";
            } catch {
              ready = null;
              const body = (await readyResponse.clone().text()).slice(0, 160);
              readyParseError = `/ready returned non-JSON HTTP ${readyResponse.status}: ${body}`;
            }
            if (readyResponse.ok && ready?.status === "ready" && ready.d1_analysis_runs === true) break;
            await new Promise(resolve => setTimeout(resolve, 1000));
          }
          assert.ok(ready, `ready endpoint did not return JSON after retries: ${readyParseError}`);
          assert.equal(readyResponse.status, 200);
          assert.equal(ready.status, "ready");
          assert.equal(ready.d1_analysis_runs, true);

          // A fresh preview Worker can still answer from an edge that has not received it yet
          // (a Cloudflare 404 or HTML page). Retry only those edge answers; the Worker's own
          // answer to an unauthenticated request is JSON and must be 401.
          let unauthorized;
          for (let attempt = 0; attempt < 10; attempt++) {
            unauthorized = await fetch(base + "/evidence/local-calculation", {
              method: "POST",
              headers: { "content-type": "application/json" },
              body: "{}"
            });
            const isWorkerJson = (unauthorized.headers.get("content-type") || "").includes("application/json") && unauthorized.status !== 404;
            if (isWorkerJson) break;
            console.log("::warning::unauthenticated probe got an edge answer (HTTP " + unauthorized.status + "), retrying");
            await new Promise(resolve => setTimeout(resolve, 3000));
          }
          assert.equal(unauthorized.status, 401, "local calculation endpoint must reject unauthenticated requests");

          const symbol = "OANDA:XAUUSD";
          const timeframe = "M5";
          const candleTime = new Date(Date.now() - 60_000).toISOString();
          const candleKey = [symbol, timeframe, candleTime].join(":");
          const headers = { "content-type": "application/json", "x-webhook-secret": secret };
          // A fresh preview Worker can answer a POST from an edge that has not received it yet,
          // with an HTML page instead of the Worker's JSON (runs on 9d9306c and 324dd86 died on
          // response.json() before any changed code ran). Every POST below goes through this
          // retry: only a non-JSON edge answer is retried; any JSON answer is returned and
          // asserted as is. The fixture POSTs are idempotent (deterministic event IDs and keys).
          const nativeFetch = globalThis.fetch;
          // A transport reset between the runner and the edge (run 42079728424 died on
          // `read ECONNRESET` right after a passing War Room proof) is not a Worker answer:
          // retry it a few times. Every request here is idempotent (GETs, and POSTs with
          // deterministic IDs and string bodies), so a retry cannot change the outcome.
          const rawFetch = async (url, init) => {
            for (let attempt = 1; ; attempt++) {
              try {
                return await nativeFetch(url, init);
              } catch (error) {
                const code = error?.cause?.code || "";
                const transport = error?.name === "TypeError" && /ECONNRESET|ETIMEDOUT|EPIPE|ECONNREFUSED|UND_ERR_SOCKET|UND_ERR_CONNECT_TIMEOUT/.test(code);
                if (!transport || attempt >= 5) throw error;
                console.log("::warning::" + (init?.method || "GET") + " " + String(url).slice(base.length) + " transport error " + code + ", retrying");
                await new Promise(resolve => setTimeout(resolve, 3000));
              }
            }
          };
          globalThis.fetch = async (url, init) => {
            if (init?.method !== "POST") return rawFetch(url, init);
            for (let attempt = 1; ; attempt++) {
              const response = await rawFetch(url, init);
              if ((response.headers.get("content-type") || "").includes("application/json") || attempt >= 10) return response;
              console.log("::warning::POST " + String(url).slice(base.length) + " got a non-JSON edge answer (HTTP " + response.status + "), retrying");
              await new Promise(resolve => setTimeout(resolve, 3000));
            }
          };

          // `wrangler secret put` creates a new Worker version that reaches isolates gradually.
          // Before asserting authenticated behaviour, wait until the secret is accepted on
          // 5 consecutive authenticated requests (an isolate without it answers 401/503).
          const probeBody = JSON.stringify({
            schema_version: "cryptophys.local-calculation.v1",
            engine: "mizan", symbol, timeframe, candle_time: candleTime, candle_key: candleKey,
            computed_at: new Date().toISOString(), calculation_version: "credential-probe",
            values: { bias: "NEUTRAL" }, provenance: { source: "preview-fixture", source_hash: "a".repeat(64), implementation_hash: "b".repeat(64) },
            secret: "must-not-be-stored"
          });
          let consecutiveAccepted = 0;
          for (let attempt = 0; attempt < 45 && consecutiveAccepted < 5; attempt++) {
            const probe = await fetch(base + "/evidence/local-calculation", { method: "POST", headers, body: probeBody });
            // Only the Worker's own answer counts: the probe carries a credential-like field, so a
            // propagated isolate with the secret answers 400. 401/503 (no secret yet) and 404/5xx
            // (workers.dev route not yet propagated) reset the streak.
            consecutiveAccepted = probe.status === 400 ? consecutiveAccepted + 1 : 0;
            if (consecutiveAccepted < 5) await new Promise(resolve => setTimeout(resolve, consecutiveAccepted ? 300 : 2000));
          }
          assert.equal(consecutiveAccepted, 5, "preview secret did not propagate to the Worker within the wait window");

          const credentialProbe = await fetch(base + "/evidence/local-calculation", {
            method: "POST",
            headers,
            body: JSON.stringify({
              schema_version: "cryptophys.local-calculation.v1",
              engine: "mizan", symbol, timeframe, candle_time: candleTime, candle_key: candleKey,
              computed_at: new Date().toISOString(), calculation_version: "credential-probe",
              values: { bias: "NEUTRAL" }, provenance: { source: "preview-fixture", source_hash: "a".repeat(64), implementation_hash: "b".repeat(64) },
              secret: "must-not-be-stored"
            })
          });
          assert.equal(credentialProbe.status, 400, "credential-like evidence fields must be rejected");

          // TradingView webhook lane: indicator outputs plus the candle's OHLCV.
          // These are the parity comparator for the local_computation lane.
          const bar = { o: 3950.1, h: 3955.2, l: 3948.0, c: 3953.4, volume: 2103 };
          const webhookValues = {
            prophet_r38: { direction: 1, buy_confirmed: true, sell_confirmed: false, buy_high_quality: false, sell_high_quality: false, t_enc: 2, d_enc: -1, structure_subtype: 0 },
            prophet_r37_ssot: { direction: 1, d_enc: -1, b_enc: 2, structure_subtype: 0, bull_event: true, bear_event: false },
            gmi_v12_70: { verdict: 3, gate: 2, gmi_dir: 1, prophet_dir: 1, conflict: false }
          };
          for (const source of ["prophet_r38", "prophet_r37_ssot", "gmi_v12_70"]) {
            // `wrangler secret put` creates a new Worker version that reaches isolates gradually:
            // a request can still land on an isolate without WEBHOOK_SECRET for a few seconds
            // after /health already saw it. Retry only that specific 503.
            let response, result;
            for (let attempt = 0; attempt < 15; attempt++) {
              response = await fetch(base + "/webhook", {
                method: "POST",
                headers,
                body: JSON.stringify({
                  source, ticker: symbol, timeframe, candle_time: candleTime, candle_key: candleKey,
                  ...bar, ...webhookValues[source],
                  metrics: { bias: "NEUTRAL", fixture_only: true }
                })
              });
              // A fresh preview Worker can still answer from an edge with an HTML page; retry it.
              if (!(response.headers.get("content-type") || "").includes("application/json")) {
                console.log("::warning::webhook " + source + " got a non-JSON edge answer (HTTP " + response.status + "), retrying");
                await new Promise(resolve => setTimeout(resolve, 3000));
                continue;
              }
              result = await response.json();
              if (!(response.status === 503 && /WEBHOOK_SECRET is not configured/.test(String(result?.error)))) break;
              await new Promise(resolve => setTimeout(resolve, 2000));
            }
            assert.ok(response.status === 202 || response.status === 200, "webhook rejected: " + JSON.stringify(result));
          }

          // A webhook on a non-analysis timeframe (15m) is stored for parity only and never starts the AI chain.
          const m15Response = await fetch(base + "/webhook", {
            method: "POST",
            headers,
            body: JSON.stringify({ source: "prophet_r38", ticker: symbol, timeframe: "15", candle_time: candleTime, ...bar, ...webhookValues.prophet_r38 })
          });
          const m15Result = await m15Response.json();
          assert.equal(m15Response.status, 202, "15m webhook: " + JSON.stringify(m15Result));
          assert.equal(m15Result.analysis_status, "stored_only", "a 15m webhook must not start the AI chain");
          assert.equal(m15Result.queued, false);
          // A HUD comparator source on H1 is stored for parity only and never starts the AI chain.
          const hudResponse = await fetch(base + "/webhook", {
            method: "POST",
            headers,
            body: JSON.stringify({ source: "prophet_r38_hud", ticker: symbol, timeframe: "60", candle_time: candleTime, ...bar, cshi_score: 0.5 })
          });
          const hudResult = await hudResponse.json();
          assert.equal(hudResponse.status, 202, "hud webhook: " + JSON.stringify(hudResult));
          assert.equal(hudResult.analysis_status, "stored_only", "a *_hud webhook must not start the AI chain");

          // local_computation lane: outputs that reproduce the webhook values on the same raw bar.
          // With PARITY_PROMOTE_AFTER=1 a single matching candle promotes Prophet and GMI autonomously;
          // Mizan is trusted because both declare the same Mizan dependency.
          const mizanDependency = { mizan: { source_hash: "a".repeat(64), implementation_hash: "b".repeat(64) } };
          const comparableFor = {
            mizan: {},
            prophet: { prophet_r38: webhookValues.prophet_r38, prophet_r37_ssot: webhookValues.prophet_r37_ssot },
            gmi: { gmi_v12_70: webhookValues.gmi_v12_70 }
          };
          const localPayload = (engine) => ({
            schema_version: "cryptophys.local-calculation.v1",
            engine, symbol, timeframe, candle_time: candleTime, candle_key: candleKey,
            computed_at: new Date().toISOString(),
            calculation_version: engine + "-preview-fixture-v1",
            values: { bias: "NEUTRAL", fixture_only: true, candle: bar, comparable: comparableFor[engine] },
            provenance: {
              source: "isolated-preview-fixture",
              source_hash: ({mizan:"a",prophet:"c",gmi:"e"})[engine].repeat(64),
              implementation_hash: ({mizan:"b",prophet:"d",gmi:"f"})[engine].repeat(64),
              ...(engine === "mizan" ? {} : { dependencies: mizanDependency })
            }
          });
          let lastLocalResult;
          let lastLocalPayload;
          for (const engine of ["mizan", "prophet", "gmi"]) {
            lastLocalPayload = localPayload(engine);
            // A fresh preview Worker can briefly answer with a Cloudflare HTML error page (5xx)
            // while the new version propagates. Retry only that non-JSON edge answer; the POST is
            // idempotent (deterministic event ID), and any JSON answer is asserted below as is.
            let response;
            for (let attempt = 0; attempt < 10; attempt++) {
              response = await fetch(base + "/evidence/local-calculation", {
                method: "POST",
                headers,
                body: JSON.stringify(lastLocalPayload)
              });
              if ((response.headers.get("content-type") || "").includes("application/json")) break;
              console.log("::warning::local-calculation " + engine + " got a non-JSON edge answer (HTTP " + response.status + "), retrying: " + (await response.text()).slice(0, 120).replace(/\s+/g, " "));
              await new Promise(resolve => setTimeout(resolve, 3000));
            }
            assert.ok((response.headers.get("content-type") || "").includes("application/json"),
              "local calculation kept answering with a non-JSON edge page (HTTP " + response.status + ")");
            lastLocalResult = await response.json();
            assert.equal(response.status, 202, "local calculation must be durably queued before ACK: " + JSON.stringify(lastLocalResult));
            assert.equal(lastLocalResult.analysis_status, "queued");
          }

          // Queue processing is asynchronous. Wait for measured parity and the fail-closed
          // synthesis instead of expecting the request handler to run reconciliation inline.
          // A poll that times out or hits a transient edge error is retried by its loop; it must
          // never abort the whole proof (one slow answer from a fresh preview Worker did).
          // The timeout also covers reading the body (the run on 2152e3c aborted inside
          // response.json() after fetch had resolved), so the body is read and parsed here: the
          // caller gets { ok, status, json() } with the JSON already parsed, or ok: false.
          const pollFetch = async (url) => {
            try {
              const response = await fetch(url, { signal: AbortSignal.timeout(10000) });
              const body = JSON.parse(await response.text());
              return { ok: response.ok, status: response.status, json: async () => body };
            } catch (error) {
              console.log("::warning::poll " + url.slice(base.length) + " failed: " + (error?.name || "error") + ", retrying");
              return { ok: false };
            }
          };
          // The queue consumer runs one batch at a time and this run's own War Room and bus tasks
          // share it: 180 s leaves room for a busy consumer without hiding a stuck one.
          const retryDeadline = Date.now() + 180_000;
          let queueReady = null;
          let latestDecision = null;
          while (Date.now() < retryDeadline) {
            const [readyResponse, decisionResponse] = await Promise.all([
              pollFetch(base + "/ready"),
              pollFetch(base + "/api/decision/" + encodeURIComponent(candleKey))
            ]);
            if (readyResponse.ok) queueReady = await readyResponse.json();
            if (decisionResponse.ok) {
              const candidate = await decisionResponse.json();
              if (candidate.status === "ok" && candidate.synthesis?.evidence_fusion) latestDecision = candidate.synthesis;
            }
            if ((queueReady?.registry_status_counts?.approved ?? 0) >= 2 && latestDecision) break;
            await new Promise(resolve => setTimeout(resolve, 2000));
          }

          assert.ok((queueReady?.registry_status_counts?.approved ?? 0) >= 2,
            "Prophet and GMI identities must be promoted only after Queue-driven parity: " + JSON.stringify(queueReady));
          assert.ok(latestDecision, "Queue consumer must persist an asynchronous analysis synthesis");
          assert.equal(latestDecision.evidence_fusion.complete, false,
            "fixture without fresh news must remain degraded");
          assert.ok(latestDecision.evidence_fusion.missing_evidence?.includes("fundamental_news_analysis"),
            "fresh completed news must remain a mandatory missing-evidence blocker in this fixture test");
          assert.ok(!latestDecision.evidence_fusion.missing_evidence?.some(item => item.startsWith("local_calculation:")),
            "all three local calculation contract records should have been fused");

          const firstSynthesisTimestamp = latestDecision.timestamp;
          const duplicateResponse = await fetch(base + "/evidence/local-calculation", {
            method: "POST",
            headers,
            body: JSON.stringify(lastLocalPayload)
          });
          const duplicateResult = await duplicateResponse.json();
          assert.equal(duplicateResponse.status, 202, "duplicate evidence is accepted into the durable queue");
          assert.equal(duplicateResult.event_id, lastLocalResult.event_id,
            "duplicate evidence must retain the same deterministic event ID");
          await new Promise(resolve => setTimeout(resolve, 3000));
          const finalDecisionResponse = await fetch(base + "/api/decision/" + encodeURIComponent(candleKey));
          const finalDecision = await finalDecisionResponse.json();
          assert.equal(finalDecision.synthesis?.timestamp, firstSynthesisTimestamp,
            "duplicate queue delivery must not rerun the same degraded AI analysis");

          // Multi-agent bus (MULTI_AGENT_BUS_ENABLED=true in wrangler.preview.jsonc only):
          // after the synthesis is persisted, a separate queue task runs 2 agents x 2 rounds
          // plus a moderator on real Workers AI. Prove the output, the model and the consensus.
          const busDeadline = Date.now() + 360_000;
          let bus = null;
          while (Date.now() < busDeadline) {
            const busResponse = await pollFetch(base + "/api/bus?candle_key=" + encodeURIComponent(candleKey));
            if (busResponse.ok) bus = await busResponse.json();
            if (bus?.items?.some(item => item.agent === "moderator")) break;
            await new Promise(resolve => setTimeout(resolve, 5000));
          }
          console.log("BUS PROOF " + JSON.stringify({
            enabled: bus?.enabled,
            consensus: bus?.consensus,
            agreement_with_chain: bus?.agreement_with_chain,
            messages: (bus?.items || []).map(item => ({
              round: item.round, agent: item.agent, status: item.status, model: item.model,
              fallback_used: item.fallback_used, usage_tokens: item.usage_tokens, latency_ms: item.latency_ms,
              stance: item.stance ?? null, confidence: item.confidence, refs: item.refs,
              text: String(item.insight ?? item.summary ?? "").slice(0, 300), errors: item.errors, primary_error: item.primary_error
            }))
          }, null, 2));
          assert.equal(bus?.enabled, true, "preview must run the bus");
          assert.equal(bus?.items?.length, 5, "bus must store technical+news x 2 rounds + moderator");
          assert.ok(bus.items.every(item => item.status === "ok"),
            "every bus message must be schema-valid model output");
          // Acceptance: the primary model (glm-5.3-flash, owner decision) must answer. A fallback-only
          // run does not prove the configured model and fails. Any fallback answer must record why the
          // primary was not used (never a silent switch).
          const primaryAnswered = bus.items.some(item => item.fallback_used === false && item.model === "@cf/zai-org/glm-5.3-flash");
          const fallbackExplained = bus.items.every(item => item.fallback_used !== true || (typeof item.primary_error === "string" && item.primary_error.length > 0));
          if (!primaryAnswered) console.log("::error::Multi-agent bus never reached the primary model. Primary model error: " + bus.items[0]?.primary_error);
          assert.ok(primaryAnswered, "the primary model (@cf/zai-org/glm-5.3-flash) must answer at least one bus step");
          assert.ok(fallbackExplained, "every fallback answer must record the primary model error");
          assert.ok(bus.items.filter(item => item.agent !== "moderator").every(item => Array.isArray(item.refs) && item.refs.length > 0),
            "agent messages must cite refs");
          assert.ok(["BUY", "SELL", "WAIT"].includes(bus.consensus?.stance), "moderator consensus is required");
          assert.equal(latestDecision.decision?.decision ?? finalDecision.synthesis?.decision?.decision, "WAIT",
            "the bus never changes the chain decision");

          // Agent text must read as natural language (no field names, evidence paths or key=value).
          const codeLike = (text) => /\b[a-z][a-z0-9]*_[a-z0-9_]+\b|\b[a-z][a-z0-9_]+\.[a-z][a-z0-9_]+\b|\b\w+\s*=\s*\w+/.test(String(text ?? ""));
          assert.ok(bus.items.every(item => !codeLike(item.insight) && !codeLike(item.summary)), "bus messages must be natural language");

          // Threads 1H: the same debate served as one thread per H1 candle.
          const h1Response = await fetch(base + "/api/threads/" + encodeURIComponent("h1:" + candleKey));
          const h1Thread = (await h1Response.json()).thread;
          assert.equal(h1Response.status, 200, "Threads 1H must serve the candle's debate");
          assert.deepEqual(h1Thread.messages.map(m => m.step), ["r1:technical", "r1:news", "moderator"]);
          assert.ok(h1Thread.messages.slice(0, 2).every(m => m.replies.length === 1), "round-2 replies are nested under the other agent");
          assert.match(h1Thread.post.reasoning, /^No trade for this candle/, "the H1 post explains the decision in plain language");

          // TradingView webhook reading: the three alerts decoded into plain language, shown on the
          // decision card and the H1 post, and fed to the technical agent.
          const tvReading = finalDecision.tradingview_reading;
          console.log("TRADINGVIEW READING " + JSON.stringify(tvReading, null, 2));
          // Owner decision 2026-11-06: Prophet R38 and R37 read as one Prophet (one shared core).
          assert.deepEqual((tvReading?.lines || []).map(l => l.source), ["Prophet", "GMI v12.70"],
            "the decision API must decode all three webhook alerts (Prophet R38 and R37 as one Prophet)");
          assert.deepEqual(tvReading.missing, [], "all three alerts arrived");
          assert.ok([tvReading.summary, ...tvReading.lines.map(l => l.text)].every(t => t && !codeLike(t)), "the webhook reading must be natural language");
          // The fixture alerts carry a confirmed buy and a bullish, aligned GMI verdict: the stored
          // indicator fields must survive (they also carry a `metrics` object).
          assert.match(tvReading.lines[0].text, /confirmed BUY signal/, "Prophet R38 buy confirmation must be decoded");
          assert.match(tvReading.lines[0].text, /Its direction is|no clear direction/, "Prophet R37 direction must be decoded in the same line");
          assert.match(tvReading.lines[1].text, /a bullish verdict/, "GMI verdict must be decoded");
          assert.equal(tvReading.bias, "bullish");
          assert.deepEqual(h1Thread.post.tradingview?.lines?.map(l => l.source), ["Prophet", "GMI v12.70"],
            "the H1 thread post must show the webhook reading");
          const technicalR1 = bus.items.find(item => item.round === 1 && item.agent === "technical");
          if (!/Prophet|GMI/.test(String(technicalR1?.insight ?? ""))) console.log("::warning::The technical agent did not name a TradingView indicator in round 1.");

          // Phase 3a: news thread. The preview has no news ingestion, so a preview-only fixture
          // (PREVIEW_FIXTURES_ENABLED, never set in production) creates one news analysis.
          const fixtureResponse = await fetch(base + "/preview/news-analysis-fixture", { method: "POST", headers });
          const fixture = await fixtureResponse.json();
          assert.equal(fixtureResponse.status, 202, "news fixture: " + JSON.stringify(fixture));
          const threadDeadline = Date.now() + 300_000;
          let thread = null;
          const flat = (list) => list.flatMap(m => [m, ...flat(m.replies || [])]);
          while (Date.now() < threadDeadline) {
            const r = await pollFetch(base + "/api/threads/" + encodeURIComponent(fixture.thread_id));
            if (r.ok) thread = (await r.json()).thread;
            if (thread && flat(thread.messages || []).some(m => m.step === "moderator")) break;
            await new Promise(resolve => setTimeout(resolve, 5000));
          }
          const threadMessages = flat(thread?.messages || []);
          console.log("THREAD PROOF " + JSON.stringify({
            title: thread?.title,
            roots: (thread?.messages || []).map(m => m.step),
            messages: threadMessages.map(m => ({ step: m.step, parent_id: m.parent_id, status: m.status, model: m.model, fallback_used: m.fallback_used, stance: m.stance, confidence: m.confidence, text: String(m.insight ?? m.summary ?? "").slice(0, 240), primary_error: m.primary_error }))
          }, null, 2));
          assert.equal(threadMessages.length, 5, "news thread: 2 agents x 2 rounds + moderator");
          assert.ok(threadMessages.every(m => m.status === "ok"), "every thread message must be schema-valid model output");
          assert.ok(threadMessages.some(m => m.fallback_used === false && m.model === "@cf/zai-org/glm-5.3-flash"), "the primary model must answer in the thread");
          assert.ok(threadMessages.every(m => !codeLike(m.insight) && !codeLike(m.summary)), "thread messages must be natural language");
          const r2 = threadMessages.filter(m => m.step.startsWith("r2:"));
          assert.ok(r2.length === 2 && r2.every(m => m.parent_id), "round-2 replies are nested under the other agent's round-1 message");

          // Live War Room 15m (owner decision 2026-11-05): every agent opens on the bus, the
          // minority and the Risk Manager rebut (at most 3 minutes), the moderator concludes.
          // The context goes through the authenticated HTTP ingress (the same handler the pull
          // adapter reaches over RPC). The preview D1 is shared by every e2e run and a room is
          // keyed by its bar, so each proof uses a random earlier 15m close no run has used yet.
          const latest15 = Math.floor(Date.now() / 900_000) * 900_000;
          // Random alone is not enough: run 42080341191 drew a bar an earlier run had used and
          // read that run's room (other agents, older code). A bar is taken only when the shared
          // D1 has no room for it yet (404 from /api/war-room/latest?bar=).
          const randomBar = async (avoid = []) => {
            for (let attempt = 1; ; attempt++) {
              const t = new Date(latest15 - 900_000 * (2 + Math.floor(Math.random() * 90))).toISOString();
              if (avoid.includes(t)) continue;
              const probe = await pollFetch(base + "/api/war-room/latest?bar=" + encodeURIComponent(t));
              if (probe.status === 404 || attempt >= 30) return t;
              console.log("::warning::bar " + t + " already has a War Room in the shared preview D1, drawing another");
            }
          };
          const barTime = await randomBar();
          const barsFor = (closeIso) => Array.from({ length: 12 }, (_, i) => ({ t: new Date(Date.parse(closeIso) - (11 - i) * 300_000).toISOString(), o: 4000 + i, h: 4003 + i, l: 3998 + i, c: 4002 + i, v: 100 + i }));
          const recentBars = barsFor(barTime);
          const contextResponse = await fetch(base + "/evidence/m5-context", {
            method: "POST",
            headers,
            body: JSON.stringify({ schema_version: "cryptophys.local-context.v1", engine: "prophet_r38_5m", trust_status: "informational_unverified", symbol, timeframe: "5", candle_time: barTime, bias: "BULLISH", buy_confirmed: true, sell_confirmed: false, d_enc: 1, t_enc: null, recent_bars: recentBars })
          });
          assert.equal(contextResponse.status, 200, "m5 context ingress: " + JSON.stringify(await contextResponse.clone().json()));
          const waitWarRoom = async (bar) => {
            const deadline = Date.now() + 420_000;
            let room = null;
            while (Date.now() < deadline) {
              const r = await pollFetch(base + "/api/war-room/latest?bar=" + encodeURIComponent(bar));
              if (r.ok) room = (await r.json()).room;
              if (room?.conclusion && room.conclusion.status !== undefined) break;
              await new Promise(resolve => setTimeout(resolve, 5000));
            }
            return room;
          };
          const warRoomProof = (label, room) => console.log(label + " " + JSON.stringify({
            phase: room?.phase,
            openings: (room?.openings || []).map(m => ({ id: m.id, status: m.status, model: m.model, stance: m.stance, text: String(m.claim ?? "").slice(0, 200), errors: m.errors })),
            debate: (room?.debate || []).map(m => ({ id: m.id, status: m.status, stance: m.stance, rebuts: m.rebuts, conceded: m.conceded, text: String(m.argument ?? "").slice(0, 200), errors: m.errors })),
            conclusion: room?.conclusion
          }, null, 2));
          const assertWarRoom = (room, ids) => {
            assert.deepEqual((room?.openings || []).map(m => m.id), ids, "one opening per agent on the bus");
            assert.ok(room.openings.every(m => m.status === "ok"), "every opening must be schema-valid model output");
            assert.ok(room.openings.every(m => m.fallback_used === false && m.model === "@cf/zai-org/glm-5.3-flash"), "the War Room uses the primary model only");
            assert.ok(room.debate.some(m => m.id === "risk" && m.status === "ok"), "the Risk Manager rebuts in the debate");
            // A split room's rebuttals name their targets; in a unanimous room the Risk Manager
            // stress-tests the consensus and may name nobody (src/war-room.mjs validateRebuttal).
            const unanimous = room.openings.every(m => m.stance === room.openings[0].stance);
            // A dissenter the bus persuaded may concede without a target (conceded: true).
            assert.ok(room.debate.every(m => m.status === "ok" && (unanimous || m.rebuts.length || m.conceded === true)), "every rebuttal in a split room names the agents it rebuts or concedes");
            assert.equal(room.conclusion?.status, "ok", "the moderator concludes for the main panel");
            assert.equal(room.phase, "closed");
            assert.ok(room.conclusion.reasons.length >= 1 && room.conclusion.reasons.length <= 3);
            // Owner decision 2026-11-06: the conclusion gives the decision and the room's bias.
            assert.ok(["BULLISH", "BEARISH", "NEUTRAL"].includes(room.conclusion.bias), "the conclusion carries the bias beside the decision");
            const texts = [...room.openings.map(m => m.claim), ...room.debate.map(m => m.argument), room.conclusion.summary, ...room.conclusion.reasons];
            assert.ok(texts.every(t => t && !codeLike(t)), "War Room messages must be natural language");
          };
          const room1 = await waitWarRoom(barTime);
          warRoomProof("WAR ROOM PROOF", room1);
          // Owner decision 2026-11-06: the 15m room has no H1 Desk; the Higher-Timeframe Desk carries
          // the H1 chain. No 15m local records are posted for this bar, so there is no 15m Desk.
          assertWarRoom(room1, ["htf", "news", "technical", "risk"]);
          const legacyDashboard = await fetch(base + "/dashboard", { redirect: "manual" });
          assert.equal(legacyDashboard.status, 302, "the old debate/raw dashboard redirects to Nexus");

          // H1 HUD snapshot verification on a real H1 candle (local-primary chain). A HUD
          // snapshot (the preview twin of the RPC submitHud) is stored first, then the
          // calibration webhooks and the local records of the previous closed hour; parity
          // approves the fixture identities (PARITY_PROMOTE_AFTER=1), and the H1 HUD readings
          // are then verified against the approved local record. The per-H1 HUD agents are
          // retired while the War Room runs (owner decision 2026-11-05).
          const hourOpen = Math.floor(Date.now() / 3_600_000) * 3_600_000 - 3_600_000;
          const key60 = symbol + ":60:" + hourOpen;
          const nowIso = new Date().toISOString();
          const hudFixture = (timeframe, candleKey, huds) => ({ schema_version: "cryptophys.hud-snapshot.v1", symbol, timeframe, candle_key: candleKey, candle_time: new Date(Number(candleKey.split(":").pop())).toISOString(), computed_at: nowIso, not_computed: ["grid_bot_protocol"], huds });
          const h1Huds = {
            prophet: { fields: { d_enc: -1, structure_subtype: 0, t_enc: 2, cycle_intensity: 3, kww_zscore: 0.8, hurst: 0.62, efficiency_ratio: 0.55, volume_ratio: 1.1, oscillator_fast: 0.2, oscillator_slow: 0.1 }, parity: { d_enc: "prophet_r38.d_enc", structure_subtype: "prophet_r38.structure_subtype", t_enc: "prophet_r38.t_enc" } },
            decision_matrix: { fields: { verdict: 3, gate: 2, conflict: false, branch: "jma_long", is_chaos: false }, parity: { verdict: "gmi_v12_70.verdict", gate: "gmi_v12_70.gate", conflict: "gmi_v12_70.conflict" } }
          };
          const hudPost = await fetch(base + "/preview/hud-snapshot", { method: "POST", headers, body: JSON.stringify(hudFixture("60", key60, h1Huds)) });
          assert.equal(hudPost.status, 202, "H1 HUD snapshot: " + JSON.stringify(await hudPost.clone().json()));
          const h1Bar = { o: 4001.1, h: 4006.2, l: 3999.0, c: 4004.4, volume: 1800 };
          for (const source of ["prophet_r38", "prophet_r37_ssot", "gmi_v12_70"]) {
            const r = await fetch(base + "/webhook", { method: "POST", headers, body: JSON.stringify({ source, ticker: symbol, timeframe: "60", candle_time: String(hourOpen), ...h1Bar, ...webhookValues[source] }) });
            assert.equal(r.status, 202, "H1 calibration webhook " + source);
          }
          for (const engine of ["mizan", "prophet", "gmi"]) {
            const record = { ...localPayload(engine), timeframe: "60", candle_time: new Date(hourOpen).toISOString(), candle_key: key60, computed_at: new Date().toISOString(), values: { bias: "NEUTRAL", fixture_only: true, candle: h1Bar, comparable: comparableFor[engine] } };
            const r = await fetch(base + "/evidence/local-calculation", { method: "POST", headers, body: JSON.stringify(record) });
            assert.equal(r.status, 202, "H1 local calculation " + engine + ": " + JSON.stringify(await r.clone().json()));
          }
          const hudDeadline = Date.now() + 240_000;
          let hudReading = null;
          while (Date.now() < hudDeadline) {
            const r = await pollFetch(base + "/api/hud/" + encodeURIComponent(key60));
            if (r.ok) hudReading = (await r.json()).hud;
            if (hudReading?.verified_against_approved_record === true) break;
            await new Promise(resolve => setTimeout(resolve, 5000));
          }
          assert.equal(hudReading?.verified_against_approved_record, true, "H1 HUD readings are verified against the approved local record");
          assert.equal(hudReading.readings.prophet.lines.filter(l => l.verified).length, 2, "Prophet's structure and momentum lines equal the approved local record");

          // The 15m HUD agents join the War Room: one opening per HUD in the 15m snapshot.
          const barTime2 = await randomBar([barTime]);
          const key15 = symbol + ":15:" + (Date.parse(barTime2) - 900_000);
          const m15Huds = {
            trade_management: { fields: { prophet_dir: 1, gmi_dir: 1, conflict: false, gate: 2, cycle_intensity: 3, kww_zscore: 0.5, ob_filter_status: "BULL OB PASS", buy_trade_ready: false, sell_trade_ready: false, active_bull_ob: 1, active_bear_ob: 0 }, parity: {} },
            kinetic_engine: { fields: { theta: 14.2, omega: 0.6, alpha: 0.1, entropy: 0.52, is_chaos: false }, parity: {} }
          };
          const m15Post = await fetch(base + "/preview/hud-snapshot", { method: "POST", headers, body: JSON.stringify(hudFixture("15", key15, m15Huds)) });
          assert.equal(m15Post.status, 202, "15m HUD snapshot: " + JSON.stringify(await m15Post.clone().json()));
          const context2 = await fetch(base + "/evidence/m5-context", { method: "POST", headers, body: JSON.stringify({ schema_version: "cryptophys.local-context.v1", engine: "prophet_r38_5m", trust_status: "informational_unverified", symbol, timeframe: "5", candle_time: barTime2, bias: "BULLISH", buy_confirmed: true, sell_confirmed: false, d_enc: 1, t_enc: null, recent_bars: barsFor(barTime2) }) });
          assert.equal(context2.status, 200, "second m5 context");
          const room2 = await waitWarRoom(barTime2);
          warRoomProof("WAR ROOM HUD PROOF", room2);
          assertWarRoom(room2, ["htf", "news", "technical", "risk", "trade_management", "kinetic_engine"]);
          const tldr = await (await fetch(base + "/api/tldr")).json();
          assert.equal(tldr.status, "ok", "the right-panel TLDR endpoint answers");
          assert.ok(tldr.h1?.decision && tldr.news?.thread_id, "TLDR covers Threads 1H and the news thread");

          console.log(JSON.stringify({
            preview: base,
            health: "PASS",
            authentication: "PASS",
            webhook_ingestion_ack_first: "PASS",
            local_calculation_queue_ack: "PASS",
            asynchronous_parity_promotion: "PASS",
            missing_evidence_fail_closed: "PASS",
            duplicate_queue_idempotency: "PASS",
            multi_agent_bus_real_models: "PASS",
            news_thread_real_models: "PASS",
            war_room_real_models: "PASS",
            threads_1h: "PASS",
            h1_hud_snapshot_verified: "PASS",
            war_room_hud_agents: "PASS",
            right_panel_tldr: "PASS",
            natural_language: "PASS",
            multi_agent_bus_model: bus.items.some(item => item.fallback_used === false) ? "glm-5.3-flash" : "fallback (see primary_error)",
            complete_AI_chain: "NOT_TESTED: no real fresh news/Pine-parity evidence in this fixture"
          }, null, 2));
          NODE

      - name: Detach preview Queue consumer and delete isolated Worker
        if: always() && env.PREVIEW_WORKER_NAME != ''
        shell: bash
        run: |
          npx wrangler queues consumer worker remove xauusd-webhook-events-preview "$PREVIEW_WORKER_NAME" --config wrangler.preview.jsonc || echo "No preview Queue consumer to detach."
          npx wrangler delete --name "$PREVIEW_WORKER_NAME" --config wrangler.preview.jsonc --force || echo "Preview Worker was not created or could not be deleted; inspect Cloudflare account state."
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
