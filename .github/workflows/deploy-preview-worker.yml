name: Deploy and test isolated Evidence Fusion preview

on:
  pull_request:
    paths:
      - "src/**"
      - "test/**"
      - "migrations/**"
      - "schema.sql"
      - "wrangler.jsonc"
      - "wrangler.preview.jsonc"
      - "package.json"
      - ".github/workflows/deploy-preview-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: evidence-fusion-preview
  cancel-in-progress: false

jobs:
  preview-e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Apply preview D1 migration when a D1-scoped token is configured
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${CLOUDFLARE_D1_API_TOKEN:-}" ]; then
            CLOUDFLARE_API_TOKEN="$CLOUDFLARE_D1_API_TOKEN" npx wrangler d1 migrations apply xauusd-signals --remote --config wrangler.preview.jsonc
          else
            echo "Using the pre-provisioned isolated preview D1. The /ready acceptance check will fail if analysis_runs is missing."
          fi
        env:
          CLOUDFLARE_D1_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}

      - name: Deploy isolated preview Worker
        shell: bash
        run: |
          set -euo pipefail
          PREVIEW_WORKER_NAME="xauusd-ai-preview-${GITHUB_RUN_ID}"
          echo "PREVIEW_WORKER_NAME=$PREVIEW_WORKER_NAME" >> "$GITHUB_ENV"
          set +e
          DEPLOY_OUTPUT="$(npx wrangler deploy --name "$PREVIEW_WORKER_NAME" --config wrangler.preview.jsonc 2>&1)"
          DEPLOY_STATUS=$?
          set -e
          printf '%s\n' "$DEPLOY_OUTPUT"
          if [ "$DEPLOY_STATUS" -ne 0 ]; then
            echo "Preview Worker deployment failed with exit code $DEPLOY_STATUS." >&2
            exit "$DEPLOY_STATUS"
          fi
          PREVIEW_URL="$(printf '%s\n' "$DEPLOY_OUTPUT" | grep -Eo 'https://[^[:space:]]+workers\.dev' | head -n 1 || true)"
          if [ -z "$PREVIEW_URL" ]; then
            echo "Could not resolve the preview workers.dev URL from Wrangler output." >&2
            exit 1
          fi
          echo "PREVIEW_BASE_URL=$PREVIEW_URL" >> "$GITHUB_ENV"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Configure ephemeral preview-only webhook secret
        shell: bash
        run: |
          set -euo pipefail
          PREVIEW_SECRET="$(node -e 'process.stdout.write(require("node:crypto").randomBytes(32).toString("hex"))')"
          echo "::add-mask::$PREVIEW_SECRET"
          echo "PREVIEW_WEBHOOK_SECRET=$PREVIEW_SECRET" >> "$GITHUB_ENV"
          printf '%s' "$PREVIEW_SECRET" | npx wrangler secret put WEBHOOK_SECRET --name "$PREVIEW_WORKER_NAME" --config wrangler.preview.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Run isolated end-to-end degraded-evidence acceptance
        run: |
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";

          const base = process.env.PREVIEW_BASE_URL;
          const secret = process.env.PREVIEW_WEBHOOK_SECRET;
          assert.ok(base && base.startsWith("https://"), "preview URL is required");
          assert.ok(secret, "ephemeral preview secret is required");

          let healthResponse;
          let health;
          let healthParseError = "no response";
          for (let attempt = 0; attempt < 10; attempt++) {
            try {
              healthResponse = await fetch(base + "/health", { signal: AbortSignal.timeout(15000) });
            } catch (error) {
              // A freshly deployed workers.dev route can time out while it propagates; retry instead of failing.
              healthParseError = "fetch failed: " + (error?.name || "error");
              await new Promise(resolve => setTimeout(resolve, 2000));
              continue;
            }
            try {
              health = await healthResponse.clone().json();
              healthParseError = "";
            } catch {
              health = null;
              const body = (await healthResponse.clone().text()).slice(0, 160);
              healthParseError = `/health returned non-JSON HTTP ${healthResponse.status}: ${body}`;
            }
            if (healthResponse.ok && health?.status === "ok" && health.secrets_configured?.webhook_secret === true) break;
            await new Promise(resolve => setTimeout(resolve, 1000));
          }
          assert.ok(health, `health endpoint did not return JSON after retries: ${healthParseError}`);
          assert.equal(healthResponse.status, 200);
          assert.equal(health.status, "ok");
          for (const name of ["d1", "signal_cache", "webhook_buffer", "knowledge_base", "workers_ai"]) {
            assert.equal(health.bindings?.[name], true, "missing preview binding: " + name);
          }
          assert.equal(health.secrets_configured?.webhook_secret, true, "preview secret must be visible to the Worker");
          let readyResponse;
          let ready;
          let readyParseError = "no response";
          for (let attempt = 0; attempt < 10; attempt++) {
            try {
              readyResponse = await fetch(base + "/ready", { signal: AbortSignal.timeout(15000) });
            } catch (error) {
              readyParseError = "fetch failed: " + (error?.name || "error");
              await new Promise(resolve => setTimeout(resolve, 2000));
              continue;
            }
            try {
              ready = await readyResponse.clone().json();
              readyParseError = "";
            } catch {
              ready = null;
              const body = (await readyResponse.clone().text()).slice(0, 160);
              readyParseError = `/ready returned non-JSON HTTP ${readyResponse.status}: ${body}`;
            }
            if (readyResponse.ok && ready?.status === "ready" && ready.d1_analysis_runs === true) break;
            await new Promise(resolve => setTimeout(resolve, 1000));
          }
          assert.ok(ready, `ready endpoint did not return JSON after retries: ${readyParseError}`);
          assert.equal(readyResponse.status, 200);
          assert.equal(ready.status, "ready");
          assert.equal(ready.d1_analysis_runs, true);

          const unauthorized = await fetch(base + "/evidence/local-calculation", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: "{}"
          });
          assert.equal(unauthorized.status, 401, "local calculation endpoint must reject unauthenticated requests");

          const symbol = "OANDA:XAUUSD";
          const timeframe = "M5";
          const candleTime = new Date(Date.now() - 60_000).toISOString();
          const candleKey = [symbol, timeframe, candleTime].join(":");
          const headers = { "content-type": "application/json", "x-webhook-secret": secret };

          // `wrangler secret put` creates a new Worker version that reaches isolates gradually.
          // Before asserting authenticated behaviour, wait until the secret is accepted on
          // 5 consecutive authenticated requests (an isolate without it answers 401/503).
          const probeBody = JSON.stringify({
            schema_version: "cryptophys.local-calculation.v1",
            engine: "mizan", symbol, timeframe, candle_time: candleTime, candle_key: candleKey,
            computed_at: new Date().toISOString(), calculation_version: "credential-probe",
            values: { bias: "NEUTRAL" }, provenance: { source: "preview-fixture", source_hash: "a".repeat(64), implementation_hash: "b".repeat(64) },
            secret: "must-not-be-stored"
          });
          let consecutiveAccepted = 0;
          for (let attempt = 0; attempt < 45 && consecutiveAccepted < 5; attempt++) {
            const probe = await fetch(base + "/evidence/local-calculation", { method: "POST", headers, body: probeBody });
            consecutiveAccepted = probe.status === 401 || probe.status === 503 ? 0 : consecutiveAccepted + 1;
            if (consecutiveAccepted < 5) await new Promise(resolve => setTimeout(resolve, consecutiveAccepted ? 300 : 2000));
          }
          assert.equal(consecutiveAccepted, 5, "preview secret did not propagate to the Worker within the wait window");

          const credentialProbe = await fetch(base + "/evidence/local-calculation", {
            method: "POST",
            headers,
            body: JSON.stringify({
              schema_version: "cryptophys.local-calculation.v1",
              engine: "mizan", symbol, timeframe, candle_time: candleTime, candle_key: candleKey,
              computed_at: new Date().toISOString(), calculation_version: "credential-probe",
              values: { bias: "NEUTRAL" }, provenance: { source: "preview-fixture", source_hash: "a".repeat(64), implementation_hash: "b".repeat(64) },
              secret: "must-not-be-stored"
            })
          });
          assert.equal(credentialProbe.status, 400, "credential-like evidence fields must be rejected");

          // TradingView webhook lane: indicator outputs plus the candle's OHLCV.
          // These are the parity comparator for the local_computation lane.
          const bar = { o: 3950.1, h: 3955.2, l: 3948.0, c: 3953.4, volume: 2103 };
          const webhookValues = {
            prophet_r38: { direction: 1, buy_confirmed: true, sell_confirmed: false, buy_high_quality: false, sell_high_quality: false, t_enc: 2, d_enc: -1, structure_subtype: 0 },
            prophet_r37_ssot: { direction: 1, d_enc: -1, b_enc: 2, structure_subtype: 0, bull_event: true, bear_event: false },
            gmi_v12_70: { verdict: 3, gate: 2, gmi_dir: 1, prophet_dir: 1, conflict: false }
          };
          for (const source of ["prophet_r38", "prophet_r37_ssot", "gmi_v12_70"]) {
            // `wrangler secret put` creates a new Worker version that reaches isolates gradually:
            // a request can still land on an isolate without WEBHOOK_SECRET for a few seconds
            // after /health already saw it. Retry only that specific 503.
            let response, result;
            for (let attempt = 0; attempt < 15; attempt++) {
              response = await fetch(base + "/webhook", {
                method: "POST",
                headers,
                body: JSON.stringify({
                  source, ticker: symbol, timeframe, candle_time: candleTime, candle_key: candleKey,
                  ...bar, ...webhookValues[source],
                  metrics: { bias: "NEUTRAL", fixture_only: true }
                })
              });
              result = await response.json();
              if (!(response.status === 503 && /WEBHOOK_SECRET is not configured/.test(String(result?.error)))) break;
              await new Promise(resolve => setTimeout(resolve, 2000));
            }
            assert.ok(response.status === 202 || response.status === 200, "webhook rejected: " + JSON.stringify(result));
          }

          // local_computation lane: outputs that reproduce the webhook values on the same raw bar.
          // With PARITY_PROMOTE_AFTER=1 a single matching candle promotes Prophet and GMI autonomously;
          // Mizan is trusted because both declare the same Mizan dependency.
          const mizanDependency = { mizan: { source_hash: "a".repeat(64), implementation_hash: "b".repeat(64) } };
          const comparableFor = {
            mizan: {},
            prophet: { prophet_r38: webhookValues.prophet_r38, prophet_r37_ssot: webhookValues.prophet_r37_ssot },
            gmi: { gmi_v12_70: webhookValues.gmi_v12_70 }
          };
          const localPayload = (engine) => ({
            schema_version: "cryptophys.local-calculation.v1",
            engine, symbol, timeframe, candle_time: candleTime, candle_key: candleKey,
            computed_at: new Date().toISOString(),
            calculation_version: engine + "-preview-fixture-v1",
            values: { bias: "NEUTRAL", fixture_only: true, candle: bar, comparable: comparableFor[engine] },
            provenance: {
              source: "isolated-preview-fixture",
              source_hash: ({mizan:"a",prophet:"c",gmi:"e"})[engine].repeat(64),
              implementation_hash: ({mizan:"b",prophet:"d",gmi:"f"})[engine].repeat(64),
              ...(engine === "mizan" ? {} : { dependencies: mizanDependency })
            }
          });
          let lastLocalResult;
          let lastLocalPayload;
          for (const engine of ["mizan", "prophet", "gmi"]) {
            lastLocalPayload = localPayload(engine);
            const response = await fetch(base + "/evidence/local-calculation", {
              method: "POST",
              headers,
              body: JSON.stringify(lastLocalPayload)
            });
            lastLocalResult = await response.json();
            assert.equal(response.status, 202, "local calculation must be durably queued before ACK: " + JSON.stringify(lastLocalResult));
            assert.equal(lastLocalResult.analysis_status, "queued");
          }

          // Queue processing is asynchronous. Wait for measured parity and the fail-closed
          // synthesis instead of expecting the request handler to run reconciliation inline.
          const retryDeadline = Date.now() + 90_000;
          let queueReady = null;
          let latestDecision = null;
          while (Date.now() < retryDeadline) {
            const [readyResponse, decisionResponse] = await Promise.all([
              fetch(base + "/ready", { signal: AbortSignal.timeout(10000) }),
              fetch(base + "/api/decision/" + encodeURIComponent(candleKey), { signal: AbortSignal.timeout(10000) })
            ]);
            if (readyResponse.ok) queueReady = await readyResponse.json();
            if (decisionResponse.ok) {
              const candidate = await decisionResponse.json();
              if (candidate.status === "ok" && candidate.synthesis?.evidence_fusion) latestDecision = candidate.synthesis;
            }
            if ((queueReady?.registry_status_counts?.approved ?? 0) >= 2 && latestDecision) break;
            await new Promise(resolve => setTimeout(resolve, 2000));
          }

          assert.ok((queueReady?.registry_status_counts?.approved ?? 0) >= 2,
            "Prophet and GMI identities must be promoted only after Queue-driven parity: " + JSON.stringify(queueReady));
          assert.ok(latestDecision, "Queue consumer must persist an asynchronous analysis synthesis");
          assert.equal(latestDecision.evidence_fusion.complete, false,
            "fixture without fresh news must remain degraded");
          assert.ok(latestDecision.evidence_fusion.missing_evidence?.includes("fundamental_news_analysis"),
            "fresh completed news must remain a mandatory missing-evidence blocker in this fixture test");
          assert.ok(!latestDecision.evidence_fusion.missing_evidence?.some(item => item.startsWith("local_calculation:")),
            "all three local calculation contract records should have been fused");

          const firstSynthesisTimestamp = latestDecision.timestamp;
          const duplicateResponse = await fetch(base + "/evidence/local-calculation", {
            method: "POST",
            headers,
            body: JSON.stringify(lastLocalPayload)
          });
          const duplicateResult = await duplicateResponse.json();
          assert.equal(duplicateResponse.status, 202, "duplicate evidence is accepted into the durable queue");
          assert.equal(duplicateResult.event_id, lastLocalResult.event_id,
            "duplicate evidence must retain the same deterministic event ID");
          await new Promise(resolve => setTimeout(resolve, 3000));
          const finalDecisionResponse = await fetch(base + "/api/decision/" + encodeURIComponent(candleKey));
          const finalDecision = await finalDecisionResponse.json();
          assert.equal(finalDecision.synthesis?.timestamp, firstSynthesisTimestamp,
            "duplicate queue delivery must not rerun the same degraded AI analysis");

          // Multi-agent bus (MULTI_AGENT_BUS_ENABLED=true in wrangler.preview.jsonc only):
          // after the synthesis is persisted, a separate queue task runs 2 agents x 2 rounds
          // plus a moderator on real Workers AI. Prove the output, the model and the consensus.
          const busDeadline = Date.now() + 300_000;
          let bus = null;
          while (Date.now() < busDeadline) {
            const busResponse = await fetch(base + "/api/bus?candle_key=" + encodeURIComponent(candleKey), { signal: AbortSignal.timeout(10000) });
            if (busResponse.ok) bus = await busResponse.json();
            if (bus?.items?.some(item => item.agent === "moderator")) break;
            await new Promise(resolve => setTimeout(resolve, 5000));
          }
          console.log("BUS PROOF " + JSON.stringify({
            enabled: bus?.enabled,
            consensus: bus?.consensus,
            agreement_with_chain: bus?.agreement_with_chain,
            messages: (bus?.items || []).map(item => ({
              round: item.round, agent: item.agent, status: item.status, model: item.model,
              fallback_used: item.fallback_used, usage_tokens: item.usage_tokens, latency_ms: item.latency_ms,
              stance: item.stance ?? null, confidence: item.confidence, refs: item.refs,
              text: String(item.insight ?? item.summary ?? "").slice(0, 300), errors: item.errors, primary_error: item.primary_error
            }))
          }, null, 2));
          assert.equal(bus?.enabled, true, "preview must run the bus");
          assert.equal(bus?.items?.length, 5, "bus must store technical+news x 2 rounds + moderator");
          assert.ok(bus.items.every(item => item.status === "ok"),
            "every bus message must be schema-valid model output");
          assert.ok(bus.items.some(item => item.fallback_used === false && item.model === "reflection-ai/beam-1.0-501b-a23b"),
            "Beam must answer at least one bus step (all-fallback means Beam is unreachable from Workers AI)");
          assert.ok(bus.items.filter(item => item.agent !== "moderator").every(item => Array.isArray(item.refs) && item.refs.length > 0),
            "agent messages must cite refs");
          assert.ok(["BUY", "SELL", "WAIT"].includes(bus.consensus?.stance), "moderator consensus is required");
          assert.equal(latestDecision.decision?.decision ?? finalDecision.synthesis?.decision?.decision, "WAIT",
            "the bus never changes the chain decision");

          console.log(JSON.stringify({
            preview: base,
            health: "PASS",
            authentication: "PASS",
            webhook_ingestion_ack_first: "PASS",
            local_calculation_queue_ack: "PASS",
            asynchronous_parity_promotion: "PASS",
            missing_evidence_fail_closed: "PASS",
            duplicate_queue_idempotency: "PASS",
            multi_agent_bus_real_models: "PASS",
            complete_AI_chain: "NOT_TESTED: no real fresh news/Pine-parity evidence in this fixture"
          }, null, 2));
          NODE

      - name: Detach preview Queue consumer and delete isolated Worker
        if: always() && env.PREVIEW_WORKER_NAME != ''
        shell: bash
        run: |
          npx wrangler queues consumer worker remove xauusd-webhook-events-preview "$PREVIEW_WORKER_NAME" --config wrangler.preview.jsonc || echo "No preview Queue consumer to detach."
          npx wrangler delete --name "$PREVIEW_WORKER_NAME" --config wrangler.preview.jsonc --force || echo "Preview Worker was not created or could not be deleted; inspect Cloudflare account state."
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
