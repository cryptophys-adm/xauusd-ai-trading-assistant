name: Verify the bus_messages archive

# Owner 2026-11-15 ("setujui semua"): the retired H1 bus's D1 table bus_messages is archived to the private
# R2 bucket xauusd-room-transcripts and dropped by the AI Worker itself (src/bus-archive.mjs, hourly cron),
# because this repository's CI token has no D1 access (the first run of this workflow, 2026-11-15, failed on
# its first D1 call, before any write). This workflow only reads the archive back from R2 and reports its
# line count, size and sha256, to compare with the Worker's bus_archive log line. It never touches D1.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      BUCKET: xauusd-room-transcripts
      KEY: archive/d1/bus_messages.ndjson
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Read the archive back
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.156.2 r2 object get "$BUCKET/$KEY" --remote --file archive.ndjson
          lines=$(wc -l < archive.ndjson)
          bytes=$(wc -c < archive.ndjson)
          sha=$(sha256sum archive.ndjson | cut -d' ' -f1)
          parsed=$(jq -s 'length' archive.ndjson)
          first=$(jq -rs 'map(.ts) | min' archive.ndjson)
          last=$(jq -rs 'map(.ts) | max' archive.ndjson)
          if [ "$lines" -le 0 ] || [ "$parsed" != "$lines" ]; then
            echo "::error::the archive has $lines lines but $parsed parse as JSON rows."
            exit 1
          fi
          echo "::notice::$BUCKET/$KEY: $lines rows, $bytes bytes, sha256 $sha, ts $first to $last."
          {
            echo "### bus_messages archive"
            echo ""
            echo "| field | value |"
            echo "|---|---|"
            echo "| object | \`$BUCKET/$KEY\` |"
            echo "| rows | $lines |"
            echo "| bytes | $bytes |"
            echo "| sha256 | \`$sha\` |"
            echo "| first ts | $first |"
            echo "| last ts | $last |"
          } >> "$GITHUB_STEP_SUMMARY"
