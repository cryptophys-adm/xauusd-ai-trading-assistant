name: Retire the xauusd-content Worker

# One-off, owner-approved (2026-11-15: "pindah content queue ke cta, nexus hanya khusus war room") removal of the
# xauusd-content Worker. Its content engine and studio moved to the repository cryptophys-adm/cryptophys-cta
# (cta.cryptophys.work); its code left this repository in #359, and Omega no longer binds it. It never published
# (CONTENT_PUBLISH was "off"); its Durable Object held drafts only. Never to be redeployed.
# Idempotent: a Worker that no longer exists is reported and skipped. If Cloudflare still sees a binding to it,
# the run waits and tries again (Omega's deploy may still be settling).
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/retire-content-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: retire-content-worker
  cancel-in-progress: false

jobs:
  retire:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Delete xauusd-content (explicit name only)
        run: |
          set -uo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then echo "::error::CLOUDFLARE_API_TOKEN is not configured."; exit 1; fi
          for attempt in 1 2 3 4 5; do
            out="$(npx --yes wrangler@4.45.0 delete --name xauusd-content --force 2>&1)"; rc=$?
            echo "$out"
            if [ $rc -eq 0 ]; then echo "deleted: xauusd-content"; exit 0; fi
            if echo "$out" | grep -qiE "does not exist|not found|10007"; then echo "already absent: xauusd-content"; exit 0; fi
            echo "attempt ${attempt} failed; waiting 60 s"; sleep 60
          done
          echo "::error::failed to delete xauusd-content"; exit 1
