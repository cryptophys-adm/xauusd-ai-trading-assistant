name: Deploy Content Worker

# Deploys `xauusd-content` (the content engine, docs/RFC_CONTENT_AGENT.md; owner 2026-11-14: "persiapan
# engine post ke Instagram/threads") on main. No public URL: Nexus reaches it over a Service Binding. It
# publishes nothing while CONTENT_PUBLISH is "off" (wrangler.jsonc).
#
# The social accounts' tokens are Worker secrets, set here from GitHub secrets when the owner has added them
# (never by hand, never in chat): THREADS_ACCESS_TOKEN, THREADS_USER_ID, INSTAGRAM_ACCESS_TOKEN,
# INSTAGRAM_USER_ID. A missing one is skipped; the Worker then reports that channel as not configured.
on:
  push:
    branches: [main]
    paths:
      - "workers/xauusd-content/**"
      - "src/content-guardian.mjs"
      - "src/public-projection.mjs"
      - ".github/workflows/deploy-content.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-content
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Require Cloudflare deploy credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then echo "::error::CLOUDFLARE_API_TOKEN is not configured."; exit 1; fi

      - name: Test the content engine
        run: node --test test/content-worker.test.mjs test/public-content.test.mjs

      - name: Validate Worker bundle
        run: npx --yes wrangler@4.45.0 deploy --dry-run --config workers/xauusd-content/wrangler.jsonc

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4.45.0 deploy --config workers/xauusd-content/wrangler.jsonc

      - name: Set the account secrets that the owner added (skips the missing ones)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
        run: |
          set -euo pipefail
          for name in THREADS_ACCESS_TOKEN THREADS_USER_ID INSTAGRAM_ACCESS_TOKEN INSTAGRAM_USER_ID; do
            value="${!name:-}"
            if [ -z "$value" ]; then echo "$name: not set in GitHub secrets, skipped"; continue; fi
            printf '%s' "$value" | npx --yes wrangler@4.45.0 secret put "$name" --config workers/xauusd-content/wrangler.jsonc >/dev/null
            echo "$name: set"
          done
