name: Test Evidence Fusion

# Runs on every pull request (no path filter): its job is a required check of the main ruleset
# (ops/branch-ruleset.json), and a required check that never reports would block the PR.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: evidence-unit-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Run evidence contract tests
        run: npm test

      - name: Type-check Worker
        run: npm run typecheck

      - name: Validate Worker bundle
        run: npx wrangler deploy --dry-run --config wrangler.jsonc
